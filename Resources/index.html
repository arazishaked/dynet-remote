<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>DyNet Remote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone console — sticky header, scrolling work area, fixed tab bar. Amber = lamp output. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E2E7EC; --line:#CBD3DB;
  --fg:#16202A; --muted:#5A6776; --accent:#E39512; --accent-soft:#F7E2BC; --on-accent:#1C1304;
  --ok:#1D8752; --bad:#C0403A; --info:#2F6FB3;
  --sans:"IBM Plex Sans Hebrew", "Arial Hebrew", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px; --tab-h:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1318; --surface:#151C23; --surface-2:#1D262F; --line:#2A3541;
  --fg:#E5EAF0; --muted:#8C99A8; --accent:#F2A93B; --accent-soft:#3A2B12; --on-accent:#1C1304;
  --ok:#3BBE80; --bad:#EE6B61; --info:#6BA6E8; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#151C23; --surface-2:#1D262F; --line:#2A3541;
  --fg:#E5EAF0; --muted:#8C99A8; --accent:#F2A93B; --accent-soft:#3A2B12; --on-accent:#1C1304;
  --ok:#3BBE80; --bad:#EE6B61; --info:#6BA6E8; color-scheme:dark }

html{direction:rtl}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:10px}
.top .back{border:0;background:var(--surface-2);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.top .titles{flex:1;min-width:0}
.top h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.link-chip[data-s="on"] .dot{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.link-chip[data-s="sim"] .dot{background:var(--info)}
.link-chip[data-s="wait"] .dot{background:var(--accent);animation:blink 1s infinite}
.link-chip[data-s="err"] .dot{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.link-chip[data-s="wait"] .dot{animation:none}}

main{flex:1;padding-block:14px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--fg)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.search input{border:0;background:none;flex:1;min-width:0;height:42px;outline:none}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill b{color:var(--fg);font-weight:600}

/* tree */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.group>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 14px;font-weight:600;cursor:pointer}
.group>summary::-webkit-details-marker{display:none}
.group>summary .chev{transition:transform .15s;color:var(--muted)}
.group[open]>summary .chev{transform:rotate(-90deg)}
.group>summary .count{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:500}
.group .group{border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.group .group>summary{padding-inline-start:26px;font-weight:600;font-size:14px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;text-align:start;width:100%}
.row:active{background:var(--surface-2)}
.row .nm{flex:1;min-width:0}
.row .nm div:first-child{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .meta{font-size:12px;color:var(--muted)}
.anum{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--surface-2);border-radius:6px;padding:2px 7px;min-width:40px;text-align:center;flex:none}
.state{font-family:var(--mono);font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;flex:none;background:var(--accent-soft);color:var(--fg)}
.state[hidden]{display:none}

/* area screen */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pbtn .pn{font-family:var(--mono);font-weight:600;font-size:16px}
.pbtn .pl{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pbtn[aria-pressed="true"] .pl{color:var(--on-accent)}
.fade{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-family:var(--mono);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .15);font-weight:600}

.ch{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--line)}
.ch:first-of-type{border-top:0;padding-top:2px}
.ch .hd{display:flex;align-items:center;gap:8px}
.ch .hd .cn{flex:1;min-width:0;font-weight:500}
.ch .hd .cn small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.lvl{font-family:var(--mono);font-weight:600;min-width:46px;text-align:end;font-size:14px}
.lamp{width:12px;height:12px;border-radius:50%;flex:none;background:var(--surface-2);border:1px solid var(--line)}
.ctrl{display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px;direction:ltr}
.toggle{position:relative;width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .3);transition:inset-inline-start .15s}
.toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked="true"]::after{inset-inline-start:25px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted);background:none}
.chip b{color:var(--fg);font-weight:500}
.desc{font-size:12px;color:var(--muted)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}

/* devices */
.dev .kind{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;flex:none;background:var(--surface-2)}
.dev .kind[data-k="gateway"]{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.dev .kind[data-k="relay"],.dev .kind[data-k="load"],.dev .kind[data-k="dali"]{background:var(--accent-soft)}
.pchs{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;padding:4px 14px 12px 14px;font-size:13px;align-items:center}
.pchs .map{min-width:0}
.pchs .oc{display:flex;align-items:center;gap:6px}
.pchs .n{font-family:var(--mono);color:var(--muted);text-align:end}
.chedit{display:inline-flex;align-items:center;gap:3px;cursor:pointer;border-radius:6px;padding:1px 3px}
.chedit:active{background:var(--surface-2)}
.chedit .cnm{color:var(--fg);border-bottom:1px dotted var(--muted)}
.chedit .pen{color:var(--muted);flex:none}
.pchs .rename{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pchs .rename input{flex:1;min-width:110px;border:1px solid var(--accent);background:var(--bg);border-radius:7px;height:32px;padding:0 8px}
details.dev>summary{list-style:none;cursor:pointer}
details.dev>summary::-webkit-details-marker{display:none}

/* log */
.log{font-family:var(--mono);font-size:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log .ln{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;padding:7px 12px;border-top:1px solid var(--line);align-items:baseline}
.log .ln:first-child{border-top:0}
.log .d{font-weight:600;font-size:10.5px;border-radius:4px;padding:0 5px}
.log .d.tx{background:var(--accent-soft)}
.log .d.rx{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.log .t{color:var(--muted)}
.log .hex{direction:ltr;text-align:left;white-space:nowrap;overflow-x:auto}
.log .txt{font-family:var(--sans);font-size:13px;color:var(--fg);min-width:0}
.log .hex{grid-column:1/-1;color:var(--muted);font-size:11px}
.log .d.err{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.sendbar{display:flex;gap:8px}
.sendbar input{flex:1;min-width:0;direction:ltr;font-family:var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;height:40px}

/* settings */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px;height:42px;min-width:0}
.field input.ltr{direction:ltr;text-align:left;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.note code{font-family:var(--mono);direction:ltr;unicode-bidi:embed;background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-all}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:4px;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* project picker */
.hero{display:flex;flex-direction:column;gap:6px}
.hero h2{font-size:22px;margin:0;text-wrap:balance}
.proj{display:flex;align-items:center;gap:12px}
.proj .ic{width:42px;height:42px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;flex:none;font-family:var(--mono);font-weight:600;font-size:12px}
.dbx-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:50vh;overflow-y:auto}
.dbx-list button{display:flex;gap:10px;align-items:center;border:0;border-top:1px solid var(--line);background:var(--bg);padding:10px 12px;text-align:start}
.dbx-list button:first-child{border-top:0}
.dbx-list button:disabled{opacity:.45}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 14px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);border-radius:10px;padding:9px 14px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgb(0 0 0 / .25)}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;font-size:13.5px}
.banner span{flex:1;min-width:180px}
.icon{border:0;background:none;color:var(--muted);width:32px;height:32px;display:grid;place-items:center;border-radius:8px;flex:none}
.icon:active{background:var(--surface-2)}
.mod{font-size:10.5px;font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 5px}
.rename{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rename input{flex:1;min-width:120px;border:1px solid var(--accent);background:var(--bg);border-radius:8px;height:36px;padding:0 10px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.sdot[data-st="online"]{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.sdot[data-st="offline"]{background:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
.physsl{width:78px;accent-color:var(--accent);direction:ltr;height:26px;flex:none}
.physval{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:34px;text-align:end}
.toggle.sm{width:44px;height:26px}
.toggle.sm::after{width:18px;height:18px}
.toggle.sm[aria-checked="true"]::after{inset-inline-start:21px}
.shared{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:5px;padding:0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted);font-family:var(--sans)}
.sendbar{display:flex;gap:8px}
.sendbar input{flex:1;min-width:0;direction:ltr;font-family:var(--mono);border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 10px;height:40px}
a.btn{text-decoration:none;color:inherit}
.savebox{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;display:flex;flex-direction:column;gap:8px}
details.minor{margin:2px 0}
details.minor>summary{cursor:pointer;color:var(--info);font-size:13px;list-style:none}
details.minor>summary::-webkit-details-marker{display:none}
details.minor>summary::before{content:"▸ "}
details.minor[open]>summary::before{content:"▾ "}
details.minor .sendbar{margin-top:8px}
pre.code{direction:ltr;text-align:left;font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;margin:0;white-space:pre}
.dmeta{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dmeta span{direction:ltr;unicode-bidi:isolate}
</style>

<div class="app">
  <header class="top">
    <button class="back" id="backBtn" hidden aria-label="חזרה"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <div class="titles"><h1 id="hTitle">DyNet Remote</h1><div class="sub" id="hSub"></div></div>
    <button class="link-chip" id="linkChip" data-s="off"><span class="dot"></span><span id="linkTxt">מנותק</span></button>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in">
  <button data-tab="areas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>אזורים</button>
  <button data-tab="devices"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01M11 7.5h6M11 16.5h6"/></svg>בקרים</button>
  <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6l4 4-4 4M10 18h10"/></svg>יומן</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>פרויקט וחיבור</button>
</div></nav>

<script>
/* DLJ parser — reads a Philips Dynalite System Builder job (.dlj = zip with Current/JobData.xml, UTF-16).
   Uses only basic DOM calls so it runs both in the browser (DOMParser) and in Node (xmldom). */
var DLJ = (function () {
  function kids(el, tag) {
    var out = [];
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && (!tag || n.nodeName === tag)) out.push(n);
    }
    return out;
  }
  function kid(el, tag) {
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && n.nodeName === tag) return n;
    }
    return null;
  }
  function path(el) {
    var c = el;
    for (var i = 1; i < arguments.length && c; i++) c = kid(c, arguments[i]);
    return c;
  }
  function attr(el, n) {
    var v = el && el.getAttribute(n);
    return v == null ? '' : v;
  }

  function decodeXmlBytes(u8) {
    if (u8[0] === 0xff && u8[1] === 0xfe) return new TextDecoder('utf-16le').decode(u8.subarray(2));
    if (u8[0] === 0xfe && u8[1] === 0xff) return new TextDecoder('utf-16be').decode(u8.subarray(2));
    if (u8[0] === 0xef && u8[1] === 0xbb && u8[2] === 0xbf) return new TextDecoder('utf-8').decode(u8.subarray(3));
    if (u8[1] === 0) return new TextDecoder('utf-16le').decode(u8);
    return new TextDecoder('utf-8').decode(u8);
  }

  function deviceKind(props, flags, chCount) {
    if (props['MAC Address']) return 'gateway';
    if (flags.DALIBallastAttributes) return 'dali';
    if ('Panel Cover Type' in props) return 'panel';
    if (flags.CurrentSensorChannels) return 'relay';
    if (chCount) return 'load';
    return 'other';
  }

  function parseJob(doc, fileName) {
    var root = doc.documentElement;
    if (!root || root.nodeName !== 'DL4Job') throw new Error('הקובץ אינו פרויקט System Builder (חסר DL4Job).');

    // Physical channel count per device
    var chCount = {};
    var pc = path(root, 'NetworkData', 'Network', 'PhysicalChannelCache');
    if (pc) kids(pc, 'CachedPhysicalChannel').forEach(function (c) {
      var d = attr(c, 'duid').toUpperCase();
      chCount[d] = Math.max(chCount[d] || 0, +attr(c, 'channel') + 1);
    });

    // Devices
    var devices = {}, order = [];
    var dd = kid(root, 'DeviceData');
    (dd ? kids(dd, 'Device') : []).forEach(function (dev) {
      var duid = attr(dev, 'duid').toUpperCase();
      var dn = kid(dev, 'DyNetDevice');
      var props = {}, flags = {}, fw = '';
      var nmp = dn && kid(dn, 'NonMemoryProperties');
      (nmp ? kids(nmp, 'Property') : []).forEach(function (p) {
        kids(p).forEach(function (q) {
          var t = q.nodeName;
          if (t === 'FirmwareVersion') fw = attr(q, 'major') + '.' + attr(q, 'minor');
          else if (q.hasAttribute('name')) props[attr(q, 'name')] = attr(q, 'value');
          else flags[t] = true;

      });
      var n = chCount[duid] || 0;

        duid: duid,
        name: (props['Device Name'] || '').trim(),
        location: (props['Location'] || '').trim(),
        kind: deviceKind(props, flags, n),
        fw: fw,
        serial: props['Serial Number 64'] || '',
        mac: props['MAC Address'] || '',
        channels: n
      };
      order.push(duid);
    });

    // Logical network: folders → areas → channels
    var areas = {}, physMap = {};
    function readArea(el, folderPath) {
      var id = +attr(el, 'id');
      var a = { id: id, name: attr(el, 'name').trim(), path: folderPath, presets: {}, channels: [], devices: [] };
      kids(el).forEach(function (c) {
        if (c.nodeName === 'Channel') {
          var ch = { id: +attr(c, 'id'), name: attr(c, 'name').trim(), type: +attr(c, 'type'), desc: attr(c, 'description').trim(), phys: [] };
          kids(c, 'PhysicalChannel').forEach(function (p) {
            var d = attr(p, 'duid').toUpperCase(), num = +attr(p, 'channel');
            ch.phys.push([d, num]);
            physMap[d] = physMap[d] || {};
            physMap[d][num] = physMap[d][num] || [];
            physMap[d][num].push([id, ch.id]);
          });
          a.channels.push(ch);
        } else if (c.nodeName === 'Preset') {
          a.presets[attr(c, 'id')] = attr(c, 'name');
        } else if (c.nodeName === 'Device') {
          a.devices.push(attr(c, 'duid').toUpperCase());
        }
      });
      a.channels.sort(function (x, y) { return x.id - y.id; });

    }
    function walk(f, folderPath) {

          node.children.push(walk(c, folderPath.concat(nm)));

          areas[a.id] = a;
          node.children.push({ type: 'area', id: a.id });

    var rf = ln && kid(ln, 'Folder');

  async function parseDljBuffer(buf, fileName, JSZipLib, DOMParserCls) {
    var Z = JSZipLib || (typeof JSZip !== 'undefined' ? JSZip : null);
    var zip = await Z.loadAsync(buf);
    var f = zip.file('Current/JobData.xml') || zip.file(/JobData\.xml$/i)[0];

    var u8 = await f.async('uint8array');
    var text = decodeXmlBytes(u8);
    var P = DOMParserCls || DOMParser;
    var doc = new P().parseFromString(text, 'text/xml');
    var err = doc.getElementsByTagName('parsererror');
    if (err && err.length) throw new Error('שגיאה בקריאת ה-XML של הפרויקט.');
    var job = parseJob(doc, fileName);
    // Device code (byte 0) and box number (byte 2) live in each device's EEPROM image
    var hexFiles = {};
    zip.file(/\.source\.hex$/i).forEach(function (h) {
      var base = h.name.split('/').pop().replace(/\.source\.hex$/i, '').toUpperCase();
      hexFiles[base] = h;
    });
    for (var duid in job.devices) {
      var hf = hexFiles[duid];
      if (!hf) continue;
      var head = await hf.async('uint8array');
      job.devices[duid].dcode = head[0];
      job.devices[duid].box = head[2];
    }
    return job;
  }

      var body = text.slice(areaRe.lastIndex, end);

        tag = setAttr(tag, 'name', edits[key]);
        tag = setAttr(tag, 'user_modified', 'true');
        return setAttr(tag, 'inherited_name', 'false');
      });
      if (nb !== body) { outText += text.slice(pos, areaRe.lastIndex) + nb; pos = end; }

  if(d.kind==='preset') setLive(d.area, { preset:d.preset });
  else if(d.kind==='level') setLive(d.area, { level:[d.ch, d.pct] });
  else if(d.kind==='phys' && d.dv) setOut(d.dv.duid, d.ch, d.pct);
});
function setTcp(s){ tcp.state = s; const el = $('#tcpState'); if(el) el.textContent = { on:'מחובר', off:'לא מחובר', err:'אין חיבור' }[s] || s; }
async function tcpListen(){
  if(tcp.running) return; tcp.running = true;
  while(tcp.running && cfg.mode==='pdeg'){
    const o = await native({ kind:'tcpOpen', host:tcpHost(), port:cfg.tcpPort });
    if(!o || o.error){ setTcp('err'); logPush('err', 'אין חיבור TCP ל-PDEG: '+((o&&o.error)||''), tcpHost()+':'+cfg.tcpPort); await sleep(5000); continue; }
    setTcp('on');
    while(tcp.running){
      const r = await native({ kind:'tcpPoll', wait:10 });
      if(!r || r.error){ await sleep(1000); break; }
      if(r.b64) rxFrame(b64ToU8(r.b64));
      if(r.closed){ setTcp('err'); await sleep(2000); break; }
    }
  }
  tcp.running = false;
}

/* ───────── Dropbox: sign in on Dropbox's page, paste the code back ─────────
   The app runs on the PDEG over plain HTTP, which Dropbox won't accept as a redirect,
   so it uses Dropbox's "show me a code" flow (PKCE, no redirect). */
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
let dbxVerifierMem = '';
async function dbxAuthUrl(){
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  // Persist the verifier and WAIT for it, so it survives a WebView reload while the user is in Safari.
  // Otherwise the exchange could run with a stale verifier and Dropbox reports "code doesn't exist or has expired".
  dbxVerifierMem = v;
  if(NATIVE){ KV['dbxVerifier'] = JSON.stringify(v); await native({ kind:'kvset', key:'dbxVerifier', value:KV['dbxVerifier'] }); }
  else store.set('dbxVerifier', v);
  const u = new URL('https://www.dropbox.com/oauth2/authorize');
  u.search = new URLSearchParams({ client_id:cfg.dbxKey, response_type:'code', code_challenge:ch, code_challenge_method:'S256', token_access_type:'offline' });
  return u.toString();
}
async function dbxExchange(code){
  const body = new URLSearchParams({ code:code.trim(), grant_type:'authorization_code', client_id:cfg.dbxKey, code_verifier: dbxVerifierMem || store.get('dbxVerifier','') });
  const r = await xfetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body });
  const j = await r.json(); if(!r.ok) throw new Error(j.error_description || 'הקוד לא התקבל. נסה שוב.');
  store.set('dbx', { access:j.access_token, refresh:j.refresh_token, exp:Date.now()+j.expires_in*1000 }); store.del('dbxVerifier');
}
async function dbxToken(){
  const t = store.get('dbx', null); if(!t) return null;
  if(t.manual) return t.access;                // token pasted from the console; no refresh
  if(Date.now() < t.exp - 60000) return t.access;
  const r = await xfetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body:new URLSearchParams({ grant_type:'refresh_token', refresh_token:t.refresh, client_id:cfg.dbxKey }) });
  const j = await r.json(); if(!r.ok){ store.del('dbx'); return null; }
  t.access=j.access_token; t.exp=Date.now()+j.expires_in*1000; store.set('dbx', t); return t.access;
}
async function dbxApi(ep, args){
  const tok = await dbxToken(); if(!tok) throw new Error('יש להתחבר ל-Dropbox מחדש');
  const r = await xfetch('https://api.dropboxapi.com/2/'+ep, { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/json' }, body:JSON.stringify(args) });
  if(!r.ok) throw new Error('Dropbox '+r.status+': '+(await r.text()).slice(0,120)); return r.json();
}
const dbxArg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
async function dbxBrowse(path){
  const pane = $('#dbxPane'); if(!pane) return; pane.hidden=false;
  if(!cfg.dbxKey){ pane.innerHTML = '<div class="note">הזן קודם App key של Dropbox בכרטיס Dropbox למטה.</div>'; return; }
  let tok=null; try{ tok = await dbxToken(); }catch(e){}
  if(!tok){
    const url = await dbxAuthUrl();
    pane.innerHTML = `<div class="note">1. פתח את דף Dropbox, התחבר עם שם המשתמש והסיסמה ואשר גישה.<br>2. Dropbox יציג קוד. העתק אותו והדבק כאן.</div>
      <div class="actions">${NATIVE ? `<button class="btn primary" id="dbxOpenUrl">פתח את Dropbox</button>` : `<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">פתח את Dropbox</a>`}</div>
      <div class="sendbar"><input id="dbxCode" placeholder="הדבק את הקוד" autocomplete="off"><button class="btn primary" id="dbxCodeOk">אישור</button></div>`;
    dbxAwaitingCode = true;
    $('#dbxOpenUrl') && ($('#dbxOpenUrl').onclick = () => native({ kind:'open', url }));
    $('#dbxCodeOk').onclick = async (ev) => {
      const btn = ev.currentTarget; if(btn.disabled) return; btn.disabled = true;
      try{ await dbxExchange($('#dbxCode').value); dbxAwaitingCode = false; toast('מחובר ל-Dropbox'); dbxBrowse(''); }
      catch(e){ logPush('err', 'Dropbox: '+e.message); toast(e.message, 6000); btn.disabled = false; }
    };
    return;
  }
  pane.innerHTML = '<div class="note">טוען תיקייה…</div>';
  try{
    let res = await dbxApi('files/list_folder', { path, limit:500 }), entries = res.entries;
    while(res.has_more){ res = await dbxApi('files/list_folder/continue', { cursor:res.cursor }); entries = entries.concat(res.entries); }
    entries = entries.filter(e => e['.tag']==='folder' || /\.dlj$/i.test(e.name));
    entries.sort((a,b)=>{
      if(a['.tag']!==b['.tag']) return a['.tag']==='folder'?-1:1;
      if(a['.tag']==='folder') return a.name.localeCompare(b.name,'he');
      return (b.server_modified||'').localeCompare(a.server_modified||'');
    });
    const up = path ? path.slice(0, path.lastIndexOf('/')) : null;
    pane.innerHTML = `<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="muted"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="dbxq" type="search" placeholder="חיפוש קובץ DLJ בכל Dropbox" autocomplete="off"></div>
      <div class="note mono" style="direction:ltr;text-align:left">${esc(path||'/')}</div><div class="dbx-list">
      ${up!==null ? `<button data-dir="${esc(up)}">↩ תיקייה למעלה</button>` : ''}
      ${entries.map(e => e['.tag']==='folder' ? `<button data-dir="${esc(e.path_lower)}">📁 ${esc(e.name)}</button>` : `<button data-file="${esc(e.id)}" data-name="${esc(e.name)}">📄 ${esc(e.name)}</button>`).join('') || '<div class="empty">אין כאן קבצי DLJ.</div>'}</div>`;
    pane.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => dbxBrowse(b.dataset.dir));
    pane.querySelectorAll('[data-file]').forEach(b => b.onclick = () => dbxOpenFile(b.dataset.file, b.dataset.name));
    const sq = $('#dbxq'); if(sq) sq.addEventListener('input', () => { clearTimeout(dbxBrowse._t); const q = sq.value.trim(); dbxBrowse._t = setTimeout(() => q ? dbxSearch(q, path) : dbxBrowse(path), 350); });
  }catch(e){ pane.innerHTML = `<div class="note">${esc(e.message)}</div>`; }
}
async function dbxSearch(q, backTo){
  const pane = $('#dbxPane'); if(!pane) return;
  try{
    const res = await dbxApi('files/search_v2', { query:q, options:{ max_results:100, file_status:'active', filename_only:true } });
    const seen = {};
    const folders = (res.matches||[]).map(m => m.metadata && m.metadata.metadata)
      .filter(md => md && md['.tag']==='folder' && md.path_lower && !seen[md.path_lower] && (seen[md.path_lower]=1));
    pane.innerHTML = `<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="muted"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="dbxq" type="search" placeholder="חיפוש תיקייה בכל Dropbox" value="${esc(q)}" autocomplete="off"></div>
      <div class="dbx-list">
      <button data-back="${esc(backTo)}">↩ חזרה לעיון בתיקיות</button>
      ${folders.map(md => `<button data-dir="${esc(md.path_lower)}">📁 ${esc(md.name)}<br><span class="note mono" style="direction:ltr;font-size:11px">${esc(md.path_display||'')}</span></button>`).join('') || '<div class="empty">לא נמצאו תיקיות.</div>'}</div>`;
    pane.querySelectorAll('[data-dir]').forEach(b => b.onclick = () => dbxBrowse(b.dataset.dir));
    $('#dbxq').addEventListener('input', e => { clearTimeout(dbxBrowse._t); const v=e.target.value.trim(); dbxBrowse._t=setTimeout(()=> v ? dbxSearch(v, backTo) : dbxBrowse(backTo), 350); });
    const bk = pane.querySelector('[data-back]'); if(bk) bk.onclick = () => dbxBrowse(backTo);
    const f=$('#dbxq'); if(f){ f.focus(); const v=f.value; f.value=''; f.value=v; }
  }catch(e){ pane.innerHTML = `<div class="note">החיפוש נכשל: ${esc(e.message)}</div>`; }
}
async function dbxOpenFile(id, name){
  try{
    toast('מוריד '+name+'…');
    const tok = await dbxToken();
    const r = await xfetch('https://content.dropboxapi.com/2/files/download', { method:'POST', binary:true, headers:{ Authorization:'Bearer '+tok, 'Dropbox-API-Arg': dbxArg({ path:id }) } });
    if(!r.ok) throw new Error('ההורדה נכשלה ('+r.status+')');
    const buf = await r.arrayBuffer();
    const p = await DLJ.parseDljBuffer(buf, name);
    p.source = { dropbox:id }; setProject(p, buf); toast('נטען: '+name);
  }catch(e){ toast(e.message, 5000); }
}
async function dbxSaveWithBackup(id, bytes){
  const meta = await dbxApi('files/get_metadata', { path:id });
  const dir = meta.path_display.slice(0, meta.path_display.lastIndexOf('/'));
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  const backup = `${dir}/גיבויים/${meta.name.replace(/\.dlj$/i,'')}.${stamp}.dlj`;
  await dbxApi('files/copy_v2', { from_path:meta.path_display, to_path:backup, autorename:true });
  const tok = await dbxToken();
  const r = await xfetch('https://content.dropboxapi.com/2/files/upload', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream',
    'Dropbox-API-Arg': dbxArg({ path:meta.path_display, mode:{ '.tag':'update', update:meta.rev } }) }, body:bytes });
  if(r.status===409) throw new Error('הקובץ ב-Dropbox השתנה מאז שנפתח. פתח אותו מחדש ושנה שוב.');
  if(!r.ok) throw new Error('העלאה נכשלה ('+r.status+')');
  return backup.split('/').slice(-2).join('/');
}
/* Upload the (edited) project as a NEW .dlj in Dropbox under a chosen name. */
async function dbxSaveAs(name){
  if(!cfg.dbxKey || !store.get('dbx',null)) throw new Error('התחבר קודם ל-Dropbox.');
  if(!origDlj) origDlj = await idb.get('dlj');
  if(!origDlj) throw new Error('חסר קובץ המקור. פתח את הפרויקט שוב מ-Dropbox או מהטלפון.');
  const res = await DLJ.applyChannelNames(origDlj, P.edits || {});
  let dir = '/DyNet Remote';
  if(P.source && P.source.dropbox){ try{ const meta = await dbxApi('files/get_metadata', { path:P.source.dropbox }); dir = meta.path_display.slice(0, meta.path_display.lastIndexOf('/')); }catch(e){} }
  const fname = name.replace(/[\/\\:*?"<>|]/g,'').replace(/\.dlj$/i,'').trim() || 'DyNet';
  const path = `${dir}/${fname}.dlj`;
  const tok = await dbxToken();
  const r = await xfetch('https://content.dropboxapi.com/2/files/upload', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream',
    'Dropbox-API-Arg': dbxArg({ path, mode:'add', autorename:true }) }, body:res.bytes });
  if(!r.ok) throw new Error('העלאה נכשלה ('+r.status+')');
  const j = await r.json();
  return j.path_display || path;
}

/* ───────── boot ───────── */
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go({ tab:b.dataset.tab })));
$('#backBtn').addEventListener('click', () => go({ tab:'areas' }));
$('#linkChip').addEventListener('click', () => go({ tab:'setup' }));
document.addEventListener('click', e => { const r = e.target.closest('[data-area]'); if(r && route.area==null) go({ tab:'areas', area:+r.dataset.area }); });

(async function boot(){
  let p = store.get('project', null);
  if(!p){ try{ const s=$('#sampleProject').textContent.trim(); if(s && s[0]==='{'){ p=JSON.parse(s); p.sample=true; } }catch(e){} }
  if(p){ P = p; P.edits = P.edits || {}; }
  route = { tab: P ? 'areas' : 'setup', area:null };
  render();
  connect();
})();

</script>
