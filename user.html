/* ───────── Auto-sync the open Dropbox file ─────────
   Polls the file's rev; when it changes on Dropbox (e.g. saved from System Builder on the PC),
   reload it automatically — unless there are unsaved local edits, then just notify. */
let dbxSyncTimer = null, dbxSyncBusy = false;
function dbxSyncStart(){ if(dbxSyncTimer) return; dbxSyncTimer = setInterval(dbxSyncCheck, 20000); }
async function dbxSyncCheck(){
  if(dbxSyncBusy) return;
  if(!P || !P.source || !store.get('dbx',null)) return;
  if(!P.source.dropbox && !P.source.folder) return;
  if(document.querySelector('.modal-ov')) return;            // don't reload during a flash/confirm
  const ae=document.activeElement; if(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;   // or while typing
  dbxSyncBusy = true;
  try{
    // Folder mode: the newest .dlj in the tracked folder may be a different (newer-dated) file.
    if(P.source.folder){
      const newest = await dbxNewestInFolder(P.source.folder);
      if(newest && (newest.path_lower!==P.source.path || newest.rev!==P.source.rev)){
        if(pendingEditCount() || P.unsaved){
          toast('יש קובץ חדש יותר בתיקייה. יש לך שינויים שלא נשמרו — שמור או פתח מחדש כדי לקבל אותו.', 8000);
          P.source.path = newest.path_lower; P.source.rev = newest.rev;   // notify once
        } else {
          const tok = await dbxToken();
          const dr = await xfetch('https://content.dropboxapi.com/2/files/download', { method:'POST', binary:true, headers:{ Authorization:'Bearer '+tok, 'Dropbox-API-Arg': dbxArg({ path: newest.path_lower || newest.id }) } });
          if(dr.ok){ const buf = await dr.arrayBuffer(); await reloadProject(buf, newest.name, { folder:P.source.folder, dropbox:newest.id, path:newest.path_lower, rev:newest.rev, name:newest.name }); toast('נטען קובץ חדש מהתיקייה: '+newest.name+' ✅', 6000); }
        }
      }
      dbxSyncBusy = false; return;
    }
    const md = await dbxApi('files/get_metadata', { path:P.source.path||P.source.dropbox });
    if(md && md.rev && P.source.rev && md.rev !== P.source.rev){
      if(pendingEditCount() || P.unsaved){
        toast('הקובץ עודכן במחשב. יש לך שינויים שלא נשמרו — שמור אותם או פתח מחדש כדי לקבל את העדכון.', 8000);
        P.source.rev = md.rev;   // notify once; don't nag every 20s
      } else {
        const tok = await dbxToken();
        const dr = await xfetch('https://content.dropboxapi.com/2/files/download', { method:'POST', binary:true, headers:{ Authorization:'Bearer '+tok, 'Dropbox-API-Arg': dbxArg({ path: md.path_lower || P.source.dropbox }) } });
        if(dr.ok){ const buf = await dr.arrayBuffer(); await reloadProject(buf, P.source.name||'project.dlj', { dropbox:P.source.dropbox, path:md.path_lower||P.source.path, rev:md.rev, name:P.source.name }); toast('הקובץ עודכן מ-Dropbox ✅', 5000); }
      }
    }
  }catch(e){}
  dbxSyncBusy = false;
}
/* Reload a project in place, keeping the user roughly where they are (tab + area if it still exists). */
async function reloadProject(buf, name, source){
  const p = await DLJ.parseDljBuffer(buf, name);
  p.source = source; p.unsaved = false;
  p.edits = p.edits||{}; p.reassign = p.reassign||{}; p.devNames = p.devNames||{}; p.devAC = p.devAC||{};
  // Carry the technician config (room renames, A/C inclusion, folder) across a re-sync — keyed by area id,
  // so a renamed room keeps its name and its lights/covers/AC after a newer project file is loaded.
  p.tech = Object.assign({ names:{}, includeAC:true, folder:null }, (P&&P.tech)||{}, p.tech||{});
  const keep = { tab: route.tab, area: (route.area!=null && p.areas[route.area]) ? route.area : null };
  P = p; origDlj = buf; openFolders.clear(); openDevs.clear(); checkedAreas.clear();   // refreshed file → re-read room state on next entry
  for(const k in live) delete live[k];
  store.set('project', P); idb.put('dlj', buf);
  route = keep; render();
}
/* Folder-tracking source: the technician picks a Dropbox FOLDER and the app always loads the newest
   .dlj in it (by the date in the file name, falling back to Dropbox's modified time). This matches the
   technician's habit of saving a new dated file rather than overwriting the same one. */
async function dbxNewestInFolder(folder){
  let res = await dbxApi('files/list_folder', { path:folder, limit:500 }), entries = res.entries;
  while(res.has_more){ res = await dbxApi('files/list_folder/continue', { cursor:res.cursor }); entries = entries.concat(res.entries); }
  entries = entries.filter(e => e['.tag']==='file' && /\.dlj$/i.test(e.name));
  if(!entries.length) return null;
  entries.sort((a,b)=>{ const ka=fileDateKey(a), kb=fileDateKey(b); if(kb!==ka) return kb-ka; return (b.server_modified||'').localeCompare(a.server_modified||''); });
  return entries[0];
}
async function dbxUseFolder(folder){

    if(!newest){ toast('אין קבצי DLJ בתיקייה הזו.', 5000); return; }
    const tok = await dbxToken();
    const r = await xfetch('https://content.dropboxapi.com/2/files/download', { method:'POST', binary:true, headers:{ Authorization:'Bearer '+tok, 'Dropbox-API-Arg': dbxArg({ path:newest.path_lower || newest.id }) } });
    if(!r.ok) throw new Error('ההורדה נכשלה ('+r.status+')');
    const buf = await r.arrayBuffer();
    const p = await DLJ.parseDljBuffer(buf, newest.name);
    p.source = { folder, dropbox:newest.id, path:newest.path_lower, rev:newest.rev, name:newest.name };
    setProject(p, buf);
    P.tech.folder = folder; persist();

    const pane = $('#dbxPane'); if(pane) pane.hidden = true;
    dbxSyncStart();
  }catch(e){ toast(e.message, 6000); }
}
async function dbxOpenFile(id, name){

/* Apply all project edits (output names + logical renames) to the in-memory file and

/* Upload a specific .dlj buffer over the existing Dropbox file (used after a flash to persist the cleaned state). */
async function dbxUploadBuffer(id, bytes){

async function dbxSaveProject(id){

  let base = origDlj || await idb.get('dlj');
  if(!base){
    const dr = await xfetch('https://content.dropboxapi.com/2/files/download', { method:'POST', binary:true, headers:{ Authorization:'Bearer '+tok, 'Dropbox-API-Arg': dbxArg({ path: meta.path_lower || id }) } });
    if(!dr.ok) throw new Error('הורדת הקובץ הנוכחי נכשלה ('+dr.status+')');
    base = await dr.arrayBuffer();
  }
  const res = await applyProjectEdits(base);
  // Upload when there are pending edits OR the base itself changed (e.g. after a flash cleared a device).
  if(res.changed === 0 && !P.unsaved) return { changed:0, uploaded:false };
  const body = res.changed>0 ? res.bytes : new Uint8Array(base);
  const r = await xfetch('https://content.dropboxapi.com/2/files/upload', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream',
    'Dropbox-API-Arg': dbxArg({ path:meta.path_display, mode:{ '.tag':'update', update:meta.rev } }) }, body });
  if(r.status===409) throw new Error('הקובץ ב-Dropbox השתנה מאז שנפתח. פתח אותו מחדש ושנה שוב.');
  if(!r.ok) throw new Error('העלאה נכשלה ('+r.status+')');
  try{ const j = await r.json(); if(P.source && j && j.rev) P.source.rev = j.rev; }catch(e){}   // remember our own new rev so auto-sync won't re-pull it
  origDlj = (res.changed>0 ? res.bytes.buffer : base); idb.put('dlj', origDlj);
  return { changed: res.changed, uploaded:true };
}
/* Upload the (edited) project as a NEW .dlj in Dropbox under a chosen name. */
async function dbxSaveAs(name){
  if(!cfg.dbxKey || !store.get('dbx',null)) throw new Error('התחבר קודם ל-Dropbox.');
  if(!origDlj) origDlj = await idb.get('dlj');
  if(!origDlj) throw new Error('חסר קובץ המקור. פתח את הפרויקט שוב מ-Dropbox או מהטלפון.');
  const res = await applyProjectEdits(origDlj);
  let dir = '/DyNet Remote';
  if(P.source && P.source.dropbox){ try{ const meta = await dbxApi('files/get_metadata', { path:P.source.dropbox }); dir = meta.path_display.slice(0, meta.path_display.lastIndexOf('/')); }catch(e){} }
  const fname = name.replace(/[\/\\:*?"<>|]/g,'').replace(/\.dlj$/i,'').trim() || 'DyNet';
  const path = `${dir}/${fname}.dlj`;
  const tok = await dbxToken();
  const r = await xfetch('https://content.dropboxapi.com/2/files/upload', { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/octet-stream',
    'Dropbox-API-Arg': dbxArg({ path, mode:'add', autorename:true }) }, body:res.bytes });
  if(!r.ok) throw new Error('העלאה נכשלה ('+r.status+')');
  const j = await r.json();
  return j.path_display || path;
}

/* ───────── boot ───────── */
if(USER){ document.body.classList.add('role-user'); document.querySelectorAll('nav.tabs button[data-tab="devices"], nav.tabs button[data-tab="log"]').forEach(b => b.remove()); const g=document.querySelector('nav.tabs .in'); if(g) g.style.gridTemplateColumns='repeat(2,1fr)'; }
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab==='areas' ? { tab:'areas', area:lastArea } : { tab:b.dataset.tab })));
$('#backBtn').addEventListener('click', () => { lastArea = null; go({ tab:'areas', area:null }); });   // back = out to the room list
$('#linkChip').addEventListener('click', () => go({ tab:'setup' }));
document.addEventListener('click', e => { const r = e.target.closest('[data-area]'); if(r && route.area==null) go({ tab:'areas', area:+r.dataset.area }); });

/* ───────── End-user app: login gate + load the project assigned by the technician ─────────
   The user never picks a file or touches Dropbox — the app pulls the project (config + .dlj) that
   the technician assigned, straight from the server, and renders it locked. */
function uov(html){ let o=$('#userov'); if(!o){ o=document.createElement('div'); o.id='userov'; document.body.appendChild(o); }
  o.className='userov'; o.innerHTML=`<div class="userov-box">${html}</div>`; return o; }
function uovRemove(){ const o=$('#userov'); if(o) o.remove(); }
const uLoad = msg => `<div class="uov-load"><span class="spin"></span><div>${esc(msg)}</div></div>`;
const uBrand = `<div class="uov-brand"><span class="uov-logo">◐</span><b>DyNet Remote</b></div>`;

async function userBoot(){
  if(/type=recovery/.test(location.hash||'')){ Backend.onAuth(ev=>{ if(ev==='PASSWORD_RECOVERY') userNewPassword(); }); return userNewPassword(); }
  uov(uBrand+uLoad('מתחבר…'));
  let who=null; try{ who=await Backend.me(); }catch(e){}
  if(!who||!who.user) return userLogin();
  return userLoadProject();
}
function userLogin(){
  uov(`${uBrand}
    <h2>התחברות</h2>
    <div class="uov-note">התחבר עם המשתמש שקיבלת מהטכנאי, או הירשם וצור קשר עם הטכנאי כדי שישייך לך פרויקט.</div>
    <input id="uem" class="ltr" type="email" placeholder="אימייל" autocomplete="email">
    <input id="unm" placeholder="שם (ברישום)" autocomplete="name">
    <input id="upw" class="ltr" type="password" placeholder="סיסמה" autocomplete="current-password">
    <div class="uov-row"><button class="btn primary" id="ulogin">התחבר</button><button class="btn" id="ureg">הרשמה</button></div>
    <a href="#" id="uforgot" class="uov-link">שכחת סיסמה?</a>`);
  const em=()=>$('#uem').value.trim(), pw=()=>$('#upw').value, nm=()=>$('#unm').value.trim();
  const net=e=>/fetch|network/i.test(e&&e.message||'')?'אין חיבור לשרת. בדוק אינטרנט.':(e&&e.message);
  $('#ulogin').onclick=async e=>{ if(!em()||!pw()) return toast('אימייל + סיסמה'); e.target.disabled=true;
    try{ await Backend.signIn(em(),pw()); userLoadProject(); }catch(err){ toast(net(err)||'ההתחברות נכשלה',6000); e.target.disabled=false; } };
  $('#ureg').onclick=async e=>{ if(!em()||pw().length<6) return toast('אימייל + סיסמה (6 תווים לפחות)'); e.target.disabled=true;
    try{ await Backend.signUp(em(),pw(),{full_name:nm(),role:'user'}); toast('נרשמת! אם מופעל אימות מייל — אשר ואז התחבר.',7000);
      try{ await Backend.signIn(em(),pw()); await Backend.setRole('user').catch(()=>{}); userLoadProject(); }catch(_){ e.target.disabled=false; } }
    catch(err){ toast(net(err)||'הרישום נכשל',6000); e.target.disabled=false; } };
  $('#uforgot').onclick=async e=>{ e.preventDefault(); if(!em()) return toast('הזן קודם אימייל בשדה למעלה');
    try{ await Backend.resetPassword(em(), location.href.split('#')[0]); toast('נשלח אליך מייל לאיפוס סיסמה.',8000); }catch(err){ toast(net(err)||'השליחה נכשלה',6000); } };
}
function userNewPassword(){
  uov(`${uBrand}<h2>בחירת סיסמה חדשה</h2><div class="uov-note">בחר סיסמה חדשה (6 תווים לפחות).</div>
    <input id="unp" class="ltr" type="password" placeholder="סיסמה חדשה" autocomplete="new-password">
    <div class="uov-row"><button class="btn primary" id="usetpw">שמור סיסמה</button></div>`);
  $('#usetpw').onclick=async e=>{ const v=$('#unp').value; if(v.length<6) return toast('6 תווים לפחות'); e.target.disabled=true;
    try{ await Backend.updatePassword(v); toast('הסיסמה עודכנה ✅',4000); setTimeout(()=>{ location.hash=''; location.reload(); },1200); }
    catch(err){ toast(err.message||'העדכון נכשל',6000); e.target.disabled=false; } };
}
async function userLoadProject(){
  uov(uBrand+uLoad('טוען את הפרויקט…'));
  let projs=[]; try{ projs=await Backend.assignedProjects(); }catch(e){ return userError('טעינה נכשלה: '+e.message); }
  if(!projs.length) return userNoProject();
  if(projs.length===1) return userOpenProject(projs[0]);
  // more than one assigned → let the user choose
  uov(`${uBrand}<h2>בחר פרויקט</h2><div class="uov-note">שויכו אליך כמה פרויקטים.</div><div id="uplist" class="uov-list"></div>`);
  const list=$('#uplist');
  projs.forEach(p=>{ const b=document.createElement('button'); b.className='btn'; b.style.width='100%'; b.textContent=p.name; b.onclick=()=>userOpenProject(p); list.appendChild(b); });
  const out=document.createElement('button'); out.className='btn ghost'; out.style.marginTop='10px'; out.textContent='התנתק'; out.onclick=async()=>{ await Backend.signOut(); location.reload(); }; list.appendChild(out);
}
function userNoProject(){
  uov(`${uBrand}<h2>אין עדיין פרויקט</h2>
    <div class="uov-note">החשבון שלך נוצר, אבל הטכנאי עוד לא שייך לך פרויקט. פנה לטכנאי עם האימייל שאיתו נרשמת, ואז רענן.</div>
    <div class="uov-row"><button class="btn primary" id="uretry">רענן</button><button class="btn ghost" id="uout">התנתק</button></div>`);
  $('#uretry').onclick=()=>userLoadProject();
  $('#uout').onclick=async()=>{ await Backend.signOut(); location.reload(); };
}
function userError(msg){
  uov(`${uBrand}<h2>שגיאה</h2><div class="uov-note">${esc(msg)}</div>
    <div class="uov-row"><button class="btn primary" id="uretry">נסה שוב</button><button class="btn ghost" id="uout">התנתק</button></div>`);
  $('#uretry').onclick=()=>userLoadProject();
  $('#uout').onclick=async()=>{ await Backend.signOut(); location.reload(); };
}
async function userOpenProject(proj){
  uov(uBrand+uLoad('טוען את הפרויקט…'));
  try{
    // Ask the server to pull the newest file from the technician's Dropbox folder first (best-effort).
    try{ await Backend.syncDropbox(proj.id); const projs=await Backend.assignedProjects(); const fresh=projs.find(x=>x.id===proj.id); if(fresh) proj=fresh; }catch(_){}
    const buf=await Backend.downloadBlob(proj.id);
    const parsed=await DLJ.parseDljBuffer(buf, proj.file_name||'project.dlj');
    uovRemove();
    setProject(parsed, buf);
    P.tech = Object.assign({ names:{}, includeAC:true }, proj.config||{});
    cfg.includeAC = P.tech.includeAC!=null ? P.tech.includeAC : true; P._uc=null;
    applyUserConn(P.tech, parsed);
    P._server = { id:proj.id, version:proj.version||1 };
    render(); connect(); startNetCheck();
    startUserSync(proj.id);
  }catch(e){ userError('טעינת הפרויקט נכשלה: '+e.message); }
}
// Apply the technician-set connection (from the project config) to the user app's settings.
// Local address is locked to the technician's value; external is seeded but the user may edit it.
function applyUserConn(tech, parsed){
  const projIp = parsed && parsed.conn && parsed.conn.ip;
  cfg.localBase = tech.localBase || projIp || cfg.localBase || '';
  cfg.localPort = tech.localPort || (parsed&&parsed.conn&&parsed.conn.port) || 95;
  cfg.extBase   = tech.extBase || cfg.extBase || '';
  cfg.extPort   = tech.extPort || 95;
  cfg.conn = 'auto';
  saveCfg();
}
let _userSync=null;
function startUserSync(projectId){
  if(_userSync) clearInterval(_userSync);
  _userSync=setInterval(async()=>{
    if(!P || !P._server || document.querySelector('.modal-ov')) return;
    try{ const v=await Backend.projectVersion(projectId);
      if(v!=null && P._server && v!==P._server.version){
        const projs=await Backend.assignedProjects(); const proj=projs.find(x=>x.id===projectId);
        if(proj){ const buf=await Backend.downloadBlob(projectId); const parsed=await DLJ.parseDljBuffer(buf, proj.file_name||'project.dlj');
          const keep={tab:route.tab, area:(route.area!=null&&parsed.areas[route.area])?route.area:null};
          setProject(parsed, buf); P.tech=Object.assign({names:{},includeAC:true}, proj.config||{}); cfg.includeAC=P.tech.includeAC; P._uc=null;
          applyUserConn(P.tech, parsed);
          P._server={id:projectId, version:v}; route=keep; render();
          if(HAS_TCP) native({ kind:'tcpClose' }); connect();   // re-resolve local/external with the new address
          toast('הפרויקט עודכן ✅',4000);
        }
      }
    }catch(e){}
  }, 30000);
}

(async function boot(){
  // End-user app with a reachable server → gate on login and load the assigned project.
  if(USER && typeof Backend!=='undefined' && Backend.ready()){
    route = { tab:'areas', area:null };
    return userBoot();
  }
  let p = store.get('project', null);
  if(!p){ try{ const s=$('#sampleProject').textContent.trim(); if(s && s[0]==='{'){ p=JSON.parse(s); p.sample=true; } }catch(e){} }
  if(p){ P = p; P.edits = P.edits || {}; }
  route = { tab: P ? 'areas' : 'setup', area:null };
  render();
  connect();
  if(P && P.source && P.source.dropbox) dbxSyncStart();   // keep the open file in sync with Dropbox
})();

</script>
