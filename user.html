<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}html,body{margin:0;touch-action:manipulation}[hidden]{display:none!important}</style>
</head><body>
<script>window.__DYNET_ROLE="user";</script>
<title>DyNet Remote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
/* ═══════════ Warm Glow — the app itself glows; amber = light output ═══════════ */
/* Dark is the base theme; [data-theme="day"] is the warm-light theme. */
:root{
  --bg:#0f0b08; --bg-grad:radial-gradient(140% 85% at 50% -8%, #30240f 0%, #150f0a 44%, #0b0806 100%);
  --surface:#1a140f; --surface-2:rgba(255,255,255,.07); --track:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.065); --fg:#f5ecdc; --muted:#a2947d; --knob:#fff6e6;
  --accent:#ff9a3d; --accent-2:#ffc781; --accent-text:#ffc781; --on-accent:#2a1500;
  --accent-grad:linear-gradient(90deg,#ff7f1f,#ffb85e); --accent-soft:rgba(255,154,61,.14);
  --accent-border:rgba(255,154,61,.5); --accent-wash:rgba(255,160,70,.2);
  --glow:rgba(255,150,55,.55); --glow-strong:rgba(255,150,55,.85);
  --ok:#5fd39a; --bad:#ee6b61; --info:#6ba6e8; --on-tag:#2a1500;
  --tabbg:rgba(20,15,11,.72);
  --sans:"Rubik","Arial Hebrew","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:18px; --r-sm:12px; --tab-h:62px; color-scheme:dark;
}
:root[data-theme="day"]{
  --bg:#f7f0e4; --bg-grad:radial-gradient(135% 80% at 50% -8%, #fef7ea 0%, #f7f0e4 48%, #f1e7d6 100%);
  --surface:#fffdf8; --surface-2:#f0e7d7; --track:#ece1cf;
  --line:rgba(130,95,45,.13); --fg:#2c2016; --muted:#9a8b73; --knob:#fff;
  --accent:#f5920f; --accent-2:#ffb84d; --accent-text:#bd6a04; --on-accent:#3a2100;
  --accent-grad:linear-gradient(90deg,#f5900d,#ffb84d); --accent-soft:rgba(245,144,18,.15);
  --accent-border:rgba(245,144,18,.55); --accent-wash:rgba(245,160,60,.26);
  --glow:rgba(240,150,30,.42); --glow-strong:rgba(240,150,30,.6);
  --ok:#2aa36a; --bad:#cf4a3f; --info:#2f6fb3; --on-tag:#3a2100;
  --tabbg:rgba(255,253,248,.82); color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
html{direction:rtl}
html,body{height:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none}
body{touch-action:pan-y}            /* vertical scroll only — no sideways pan, no pinch-zoom */
input[type=range]{touch-action:none} /* keep slider dragging working */
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--fg);
  font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg{display:block}

.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
/* End-user app: header scrolls away with the content so it never covers the climate card / controls. */
body.role-user header.top{position:static}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-block:11px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:11px}
.top .back{border:1px solid var(--line);background:var(--surface-2);border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none}
.top .titles{flex:1;min-width:0}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:500;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.link-chip[data-s="on"] .dot{background:var(--ok);box-shadow:0 0 9px var(--ok)}
.link-chip[data-s="sim"] .dot{background:var(--info)}
.link-chip[data-s="wait"] .dot{background:var(--accent);animation:blink 1s infinite}
.link-chip[data-s="err"] .dot{background:var(--bad)}
@keyframes blink{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.link-chip[data-s="wait"] .dot{animation:none}}

main{flex:1;padding-block:16px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:13px}

nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--tabbg);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent-text)}
nav.tabs button[aria-current="page"] svg{color:var(--accent-text)}

.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 15px;color:var(--muted)}
.search input{border:0;background:none;flex:1;min-width:0;height:46px;outline:none;color:var(--fg)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:12px;border-radius:12px;padding:8px 13px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill b{color:var(--accent-text);font-weight:700}
.stpill{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.stpill .sdot{width:9px;height:9px}
.stpill.on{border-color:var(--accent-border);background:var(--accent-soft)}

/* tree / lists */
.group{background:transparent;border:0;border-radius:0;overflow:visible}
.group>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:16px 6px 8px;font-weight:500;font-size:12px;color:var(--muted);cursor:pointer;letter-spacing:.01em}
.group>summary::-webkit-details-marker{display:none}
.group>summary .chev{transition:transform .15s;color:var(--muted);width:14px;height:14px}
.group[open]>summary .chev{transform:rotate(-90deg)}
.group>summary .count{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:500}
.group .group>summary{padding-inline-start:16px}
.rows{display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:start;width:100%}
.row:active{transform:scale(.99)}
.row .nm{flex:1;min-width:0}
.row .nm div:first-child{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm .meta{font-size:12px;color:var(--muted);margin-top:1px}
.anum{font-family:var(--mono);font-size:13px;font-weight:600;width:44px;height:44px;border-radius:14px;background:var(--track);color:var(--muted);display:grid;place-items:center;flex:none}
.row[data-lit] .anum{background:var(--accent-grad);color:var(--on-accent);box-shadow:0 0 18px 0 var(--glow)}
.state{font-size:11.5px;font-weight:500;border-radius:999px;padding:5px 12px;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.state[hidden]{display:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:13px}
.card h2{font-size:12px;letter-spacing:.01em;color:var(--muted);margin:0;font-weight:500;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.seclbl{font-size:14px;font-weight:700;color:var(--fg);letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:13px;padding:10px 15px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--fg)}
.btn.primary{background:var(--accent-grad);border-color:transparent;color:var(--on-accent);box-shadow:0 10px 24px -12px var(--glow-strong)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}

/* presets / scenes */
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:16px;padding:13px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.pbtn .pn{font-weight:600;font-size:15px}
.pbtn .pl{font-size:11px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn[aria-pressed="true"]{background:var(--accent-grad);border-color:transparent;color:var(--on-accent);box-shadow:0 10px 26px -12px var(--glow)}
.pbtn[aria-pressed="true"] .pl{color:var(--on-accent)}
.fade{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-grad);color:var(--on-accent);font-weight:600}

/* ── area hero ring ── */
.ahero{display:flex;flex-direction:column;align-items:center;padding:6px 0 2px}
.ring{position:relative;width:206px;height:206px}
.ring .amb{position:absolute;inset:24px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(10px);opacity:.6}
.ring .tk,.ring .arc{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(circle,transparent 64%,#000 65%);mask:radial-gradient(circle,transparent 64%,#000 65%)}
.ring .tk{background:var(--track)}
.ring .arc{background:conic-gradient(from 0deg,#ff7f1f,#ffb85e calc(var(--p,0)*1%),transparent 0)}
.ring .cap{position:absolute;inset:0;rotate:calc(var(--p,0)*3.6deg)}
.ring .cap .cdot{position:absolute;top:3px;left:50%;translate:-50%;width:15px;height:15px;border-radius:50%;background:#fff3dd;box-shadow:0 0 16px 3px var(--glow-strong),0 0 0 4px var(--bg)}
.ring[style*="--p:0"] .cap,.ring[data-off] .cap{display:none}
.ring{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.ring:active{cursor:grabbing}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px}
.ring .rk{font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--accent-text);margin-bottom:3px;min-height:14px}
.ring .rv{font-size:52px;font-weight:300;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:22px;color:var(--muted);font-weight:400}
.ring .rl{font-size:12px;color:var(--muted);margin-top:7px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhint{font-size:11.5px;color:var(--muted);margin-top:9px}
.ch{cursor:pointer;transition:border-color .12s,box-shadow .12s}
.ch[data-sel]{border-color:var(--accent-border);box-shadow:0 0 0 1px var(--accent-border),0 14px 30px -16px var(--glow)}
.ch .selbadge{position:absolute;top:13px;inset-inline-start:15px;font-size:10px;font-weight:700;color:var(--on-accent);background:var(--accent-grad);border-radius:7px;padding:2px 8px;display:none;z-index:1}
.ch[data-sel] .selbadge{display:block}
.ch[data-sel] .cic{visibility:hidden}
.mpow{margin-top:18px;display:flex;gap:10px}
.mpb{padding:10px 20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.mpb svg{width:15px;height:15px}
.mpb.on{background:var(--accent-grad);color:var(--on-accent);border-color:transparent;box-shadow:0 10px 26px -12px var(--glow-strong)}

/* channels */
.ch{position:relative;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:15px 16px;overflow:hidden}
.ch + .ch{margin-top:11px}
.ch .cwash{position:absolute;inset:0;background:linear-gradient(90deg,var(--accent-wash),transparent 65%);opacity:0;pointer-events:none}
.ch .hd{position:relative;display:flex;align-items:center;gap:12px}
.ch .cic{width:34px;height:34px;border-radius:11px;background:var(--track);display:grid;place-items:center;flex:none;color:var(--muted)}
.ch .cic svg{width:18px;height:18px}
.ch[data-lit] .cic{background:var(--accent-soft);color:var(--accent-text)}
.ch .hd .cn{flex:1;min-width:0;font-weight:600}
.ch .hd .cn small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.lvl{font-weight:600;min-width:46px;text-align:end;font-size:15px;color:var(--accent-text);font-variant-numeric:tabular-nums}
.ch[data-off] .lvl,.ch[data-off] .cn{color:var(--muted)}
.lamp{display:none}
.ctrl{position:relative;display:flex;align-items:center;gap:12px;margin-top:13px}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:26px;direction:ltr;background:transparent}
.toggle{position:relative;width:50px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--track);flex:none}
.toggle::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgb(0 0 0 / .35);transition:inset-inline-start .15s}
.toggle[aria-checked="true"]{background:var(--accent-grad);border-color:transparent;box-shadow:0 0 16px -2px var(--glow)}
.toggle[aria-checked="true"]::after{inset-inline-start:23px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:8px;padding:3px 9px;color:var(--muted);background:var(--surface-2)}
.chip b{color:var(--fg);font-weight:500}
.desc{font-size:12px;color:var(--muted);margin-top:8px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* devices */
.dev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dev[open]{border-color:var(--accent-border);box-shadow:0 14px 34px -18px var(--glow)}
details.dev>summary{list-style:none;cursor:pointer}
details.dev>summary::-webkit-details-marker{display:none}
.dev .row{border:0;border-radius:0;background:none}
.dev .kind{font-size:10px;font-weight:600;border-radius:9px;padding:4px 10px;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.pendtag{font-size:10px;font-weight:700;border-radius:9px;padding:4px 9px;flex:none;background:var(--accent-grad);color:var(--on-accent);box-shadow:0 0 12px -2px var(--glow);display:inline-flex;align-items:center;gap:4px}
.pendtag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--on-accent);opacity:.7}
.dev .kind[data-k="gateway"]{background:color-mix(in srgb,var(--info) 18%,transparent);color:var(--info)}
.pchs{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;padding:6px 16px 12px;font-size:13px;align-items:center}
.pchs .map{min-width:0}
.devact{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:4px 16px 16px}
.btn.sm{padding:13px 16px;font-size:14.5px;flex:1;min-width:150px;border-radius:15px}
.btn.primary.sm{box-shadow:0 14px 30px -14px var(--glow-strong)}
.pchs .oc{display:flex;align-items:center;gap:8px}
.pchs .n{font-family:var(--mono);color:var(--muted);text-align:end;font-size:12px}
.chedit{display:inline-flex;align-items:center;gap:4px;cursor:pointer;border-radius:7px;padding:2px 4px}
.chedit:active{background:var(--surface-2)}
.chedit .cnm{color:var(--fg);border-bottom:1px dotted var(--muted)}
.chedit .pen{color:var(--muted);flex:none}
.pchs .rename{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pchs .rename input{flex:1;min-width:110px;border:1px solid var(--accent);background:var(--bg);color:var(--fg);border-radius:9px;height:34px;padding:0 9px}
.pchs .rename input.acin{flex:none;min-width:0;width:84px}
.pchs .rename label{color:var(--muted);font-size:11px;align-self:center}
.pchs .rename.acedit{flex-wrap:wrap;gap:6px}
.pchs .rename .asel{flex:1;min-width:120px;border:1px solid var(--accent);background:var(--bg);color:var(--fg);border-radius:9px;height:34px;padding:0 6px}
.asg{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:pointer;white-space:nowrap;margin-inline-start:4px}
.assign{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.assign .arow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.assign .asel{flex:1;min-width:120px;border:1px solid var(--accent);background:var(--bg);color:var(--fg);border-radius:9px;height:36px;padding:0 6px}
.pchs .mod{color:var(--accent-text);font-size:11px;font-weight:600}

/* modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;max-width:350px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.modal-msg{font-size:14.5px;line-height:1.55;margin-bottom:16px;white-space:pre-line}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}

/* log */
.log{font-size:12px;display:flex;flex-direction:column;gap:2px}
.log .ln{display:grid;grid-template-columns:auto 1fr auto;gap:3px 11px;padding:13px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.log .d{font-weight:700;font-size:10px;border-radius:8px;padding:5px 7px;align-self:start}
.log .d.tx{background:var(--accent-soft);color:var(--accent-text)}
.log .d.rx{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.log .d.err{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.log .txt{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--fg);min-width:0}
.log .hex{grid-column:2/3;direction:ltr;text-align:left;white-space:nowrap;overflow-x:auto;color:var(--muted);font-size:10.5px;font-family:var(--mono);margin-top:3px}
.log .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:10.5px}
.sendbar{display:flex;gap:8px}
.sendbar input{flex:1;min-width:0;direction:ltr;font-family:var(--mono);border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:0 11px;height:42px}

/* settings */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:11px;padding:0 12px;height:46px;min-width:0;width:100%}
.field input.ltr{direction:ltr;text-align:left;font-family:var(--mono)}
.field input:disabled,.field input.ro{opacity:.55;background:var(--card);color:var(--muted);cursor:not-allowed}

/* ───────── End-user tiled design ───────── */
.userareas{display:flex;flex-direction:column;gap:24px}
.floor+.floor{margin-top:2px}
.floor-title{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 2px 11px}
/* rooms-list view toggle (grid ↔ list) */
.rooms-toolbar{display:flex;justify-content:flex-start;margin:-2px 0 10px}
.viewtoggle{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
.viewtoggle svg{width:22px;height:22px}
.viewtoggle:active{transform:scale(.95);border-color:var(--accent);color:var(--accent)}
.urows{display:flex;flex-direction:column;gap:8px}
.urow{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);text-align:start}
.urow:active{transform:scale(.995)}
.urow .ur-nm{font-size:15px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow .ur-sub{font-size:12px;color:var(--muted);flex:none}
.urow.on{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.urow.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--glow);flex:none}
.rooms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.rooms-grid+.floor-title{margin-top:18px}
.room-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:108px;padding:15px 16px;border-radius:19px;border:1px solid var(--line);background:var(--card);color:var(--fg);text-align:right;overflow:hidden;transition:transform .12s ease,border-color .2s,box-shadow .25s}
.room-tile:active{transform:scale(.97)}
.room-tile .rt-ic{color:var(--muted);transition:color .25s}
.room-tile .rt-ic svg{width:28px;height:28px}
.room-tile .rt-nm{font-size:16px;font-weight:650;line-height:1.15}
.room-tile .rt-sub{font-size:12px;color:var(--muted);margin-top:auto}
.room-tile.on{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));box-shadow:0 10px 26px -14px var(--accent)}
.room-tile.on .rt-ic{color:var(--accent)}
.room-tile.on::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 80% at 82% 6%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 68%);pointer-events:none}

.ch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ch-tile{position:relative;display:flex;flex-direction:column;gap:7px;padding:12px 12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);overflow:hidden;min-height:118px}
.ch-tile .cwash{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -10%,var(--accent),transparent 72%);opacity:0;transition:opacity .25s;pointer-events:none}
.ch-tile .ct-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1}
.ch-tile .cic{color:var(--muted);transition:color .2s}
.ch-tile .cic svg{width:21px;height:21px}
.ch-tile[data-lit] .cic{color:var(--accent)}
.ch-tile .ct-nm{font-size:13px;font-weight:600;line-height:1.2;position:relative;z-index:1}
.ch-tile .ct-foot{position:relative;z-index:1;margin-top:auto}
.ch-tile .lvl{font-size:12.5px;font-weight:650;color:var(--muted);font-family:var(--mono)}
.ch-tile[data-lit] .lvl{color:var(--fg)}
.ch-tile .ct-slider{position:relative;z-index:1;width:100%;margin-top:2px}
.ch-tile .toggle{flex:none}
@media(max-width:360px){.ch-grid{grid-template-columns:repeat(2,1fr)}}

/* other systems — collapsed folders with a list inside */
.sys-section{margin-top:4px;display:flex;flex-direction:column;gap:10px}
.sysfolder{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.sysfolder>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:15px 16px;font-size:15px;font-weight:600}
.sysfolder>summary::-webkit-details-marker{display:none}
.sysfolder>summary .chev{color:var(--muted);transition:transform .2s}
.sysfolder[open]>summary .chev{transform:rotate(-90deg)}
.sysfolder .sf-nm{flex:1}
.sysfolder .count{font-size:12px;color:var(--muted);background:var(--bg);border-radius:20px;padding:3px 10px;font-weight:600}
.sys-list{display:flex;flex-direction:column;gap:2px;padding:5px;border-top:1px solid var(--line)}
.urow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-radius:11px;background:none;border:0;color:var(--fg);text-align:right;transition:background .15s;width:100%}
.urow:active{background:var(--bg)}
.urow .ur-nm{font-weight:550}
.urow .ur-sub{font-size:12px;color:var(--muted)}
.urow.on .ur-nm{color:var(--accent)}
.sys-group+.sys-group{margin-top:14px}
.sys-grp-t{font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 7px}
.sys-list.plain{border-top:0;padding:0;gap:1px}
/* covers: one full-width row per cover — name on the right, open / stop / close on the left */
.cov-grid{display:flex;flex-direction:column;gap:8px}
.cov-row{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:10px 12px;display:flex;align-items:center;gap:10px}
.cov-row .cov-ic{color:var(--muted);flex:none;display:flex}
.cov-row .cov-ic svg{width:22px;height:22px}
.cov-nm{font-size:14px;font-weight:600;flex:1;min-width:0;line-height:1.25;overflow-wrap:anywhere}
.cov-btns{display:flex;direction:ltr;gap:6px;flex:none}
.cov-b{display:flex;flex-direction:column;align-items:center;gap:2px;width:54px;padding:7px 2px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--fg);transition:transform .1s,border-color .15s,color .15s}
.cov-b svg{width:19px;height:19px}
.cov-b small{font-size:9.5px;font-weight:600;color:var(--muted)}
.cov-b:active{transform:scale(.94);border-color:var(--accent)}
.cov-b:active small,.cov-b:active svg{color:var(--accent)}
@media(max-width:360px){.cov-b{width:46px}}
/* air-conditioning card */
.ac-card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:14px;display:flex;flex-direction:column;gap:12px}
.ac-card+.ac-card{margin-top:10px}
.ac-hd{display:flex;align-items:center;gap:9px}
.ac-hd .ac-ic{color:var(--accent);display:flex}
.ac-hd .ac-ic svg{width:25px;height:25px}
.ac-nm{font-size:15px;font-weight:650}
.ac-row{display:flex;align-items:center;gap:10px}
.ac-lbl{font-size:12.5px;color:var(--muted);width:54px;flex:none}
.ac-seg{display:flex;gap:6px;flex:1}
.ac-b{flex:1;padding:9px 3px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:12px;font-weight:600;transition:background .12s,border-color .12s,color .12s}
.ac-b[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--bg))}
.ac-b:active{transform:scale(.96)}
/* climate (A/C) card — compact, shown at the top beside the brightness ring */
.clim-col{display:flex;flex-direction:column;gap:8px;width:100%}
.climate{--cl:var(--accent);border:1px solid var(--line);border-radius:15px;background:var(--card);padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.climate.cool{--cl:#2f8dff}
.climate.heat{--cl:#ff4d00}
.climate.on{border-color:color-mix(in srgb,var(--cl) 60%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--cl) 24%,transparent);background:color-mix(in srgb,var(--cl) 10%,var(--card))}
.cl-top{display:flex;align-items:center;gap:6px}
.cl-nm{font-size:12.5px;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-pw{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);display:flex;align-items:center;justify-content:center}
.cl-pw svg{width:16px;height:16px}
.climate.on .cl-pw,.cl-pw[aria-pressed="true"]{border-color:var(--cl);color:#fff;background:var(--cl)}
.cl-set{display:flex;align-items:center;justify-content:center;gap:8px}
.cl-step{flex:none;width:30px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:19px;font-weight:400;line-height:1;display:flex;align-items:center;justify-content:center}
.cl-step:active{transform:scale(.94);border-color:var(--cl);color:var(--cl)}
.cl-read{text-align:center;min-width:66px}
.cl-big{font-size:30px;font-weight:300;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.climate.on .cl-big{color:var(--cl)}
.cl-deg{font-size:17px;color:var(--muted)}
.cl-room{font-size:11px;color:var(--muted);margin-top:1px}
.cl-room b{color:var(--fg);font-weight:600}
.cl-mode{display:flex;gap:6px}
.cl-md{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 2px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted);font-size:11px;font-weight:600}
.cl-md svg{width:16px;height:16px}
.cl-md[aria-pressed="true"]{border-color:var(--cl);color:var(--cl);background:color-mix(in srgb,var(--cl) 13%,var(--bg))}
.cl-md:active{transform:scale(.96)}
.cl-fan{display:flex;gap:5px}
.cl-fb{flex:1;padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font-size:10.5px;font-weight:600}
.cl-fb[aria-pressed="true"]{border-color:var(--cl);color:var(--cl);background:color-mix(in srgb,var(--cl) 13%,var(--bg))}
.cl-fb:active{transform:scale(.95)}
/* "running A/C" indication at the top of the rooms list */
.ac-active{display:flex;flex-direction:column;gap:8px}
.ac-live{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1px solid var(--accent-border);border-radius:14px;background:var(--accent-soft);color:var(--fg);text-align:start}
.ac-live:active{transform:scale(.99)}
.ac-live .al-ic{color:var(--accent);display:flex;flex:none}.ac-live .al-ic svg{width:22px;height:22px}
.ac-live .al-nm{font-weight:650;font-size:14px}
.ac-live .al-t{color:var(--muted);font-size:12.5px;margin-inline-start:auto;white-space:nowrap}
.ac-live .al-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px 1px var(--glow)}
/* hero: ring centered in the middle column, climate card to one side */
.ahero.has-climate{display:grid;grid-template-columns:minmax(118px,1fr) auto minmax(118px,1fr);gap:12px;align-items:center;flex-direction:row}
.ahero.has-climate .hero-ring{display:flex;flex-direction:column;align-items:center;justify-self:center}
.ahero.has-climate .hero-side{min-width:0;align-self:center}
.ahero.clim-only{display:flex}.ahero.clim-only .hero-side{width:100%;max-width:320px}
/* phone: climate card full width at the top, ring below it (as in the reference) */
@media(max-width:470px){
  .ahero.has-climate{grid-template-columns:1fr;gap:12px}
  .ahero.has-climate .hero-side{order:-1;justify-self:stretch}
  .ahero.has-climate .hero-spacer{display:none}
}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
/* technician room-rename bar */
/* end-user login / loading overlay */
.userov{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.userov-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:11px}
.userov-box h2{margin:2px 0;font-size:20px}
.userov-box input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;color:var(--fg);padding:12px 13px;font-size:16px;outline:none}
.userov-box input:focus{border-color:var(--accent)}
.uov-note{font-size:13px;color:var(--muted);line-height:1.55}
.uov-row{display:flex;gap:10px;margin-top:4px}
.uov-row .btn{flex:1}
.uov-link{font-size:13px;color:var(--muted);text-decoration:underline;text-align:center;margin-top:4px}
.uov-brand{display:flex;align-items:center;gap:9px;font-size:16px;margin-bottom:4px}
.uov-brand .uov-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#ffb062);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.uov-load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0;color:var(--muted)}
.spin{display:inline-block;width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:uspin .7s linear infinite}
@keyframes uspin{to{transform:rotate(360deg)}}
.uov-list{display:flex;flex-direction:column;gap:8px}
.rnbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 12px;margin-bottom:10px;border:1px dashed var(--line);border-radius:12px;background:var(--card);font-size:13px}
.rnbar>span{flex:1;min-width:0}
.rnbar .rename{display:flex;gap:6px;flex:1;width:100%}
.rnbar .rename input{flex:1;min-width:0}
.note{font-size:12.5px;color:var(--muted);line-height:1.55}
.note code{font-family:var(--mono);direction:ltr;unicode-bidi:embed;background:var(--surface-2);padding:1px 5px;border-radius:5px;word-break:break-all}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--bg)}
.radio label:has(input:checked){border-color:var(--accent-border);background:var(--accent-soft)}
.radio input{margin-top:4px;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:12px}
/* theme toggle */
.themeseg{display:flex;background:var(--track);border-radius:13px;padding:4px;gap:4px}
.themeseg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.themeseg button svg{width:16px;height:16px}
.themeseg button[aria-pressed="true"]{background:var(--accent-grad);color:var(--on-accent);font-weight:600}

/* project picker */
.hero{display:flex;flex-direction:column;gap:7px}
.hero h2{font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
.proj{display:flex;align-items:center;gap:13px}
.proj .ic{width:46px;height:46px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);display:grid;place-items:center;flex:none;font-family:var(--mono);font-weight:600;font-size:12px}
.dbx-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-height:50vh;overflow-y:auto}
.dbx-list button{display:flex;gap:11px;align-items:center;border:0;border-top:1px solid var(--line);background:var(--bg);color:var(--fg);padding:13px 14px;text-align:start}
.dbx-list button:first-child{border-top:0}
.dbx-list button:disabled{opacity:.45}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);border-radius:14px;padding:11px 16px;font-size:13.5px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgb(0 0 0 / .35)}

.banner{display:flex;align-items:center;gap:11px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:var(--r);padding:12px 15px;font-size:13.5px}
.banner span{flex:1;min-width:180px}
.icon{border:0;background:none;color:var(--muted);width:34px;height:34px;display:grid;place-items:center;border-radius:9px;flex:none}
.icon:active{background:var(--surface-2)}
.mod{font-size:10.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-text);border-radius:6px;padding:1px 6px}
.rename{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rename input{flex:1;min-width:120px;border:1px solid var(--accent);background:var(--bg);color:var(--fg);border-radius:11px;height:38px;padding:0 11px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.sdot[data-st="online"]{background:var(--ok);box-shadow:0 0 9px var(--ok)}
.sdot[data-st="offline"]{background:var(--bad);box-shadow:0 0 9px var(--bad)}
.physsl{width:78px;accent-color:var(--accent);direction:ltr;height:26px;flex:none}
.physval{font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:34px;text-align:end}
.toggle.sm{width:44px;height:26px}
.toggle.sm::after{width:18px;height:18px}
.toggle.sm[aria-checked="true"]::after{inset-inline-start:21px}
.shared{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}
a.btn{text-decoration:none;color:inherit}
.savebox{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:9px}
details.minor{margin:2px 0}
details.minor>summary{cursor:pointer;color:var(--accent-text);font-size:13px;list-style:none}
details.minor>summary::-webkit-details-marker{display:none}
details.minor>summary::before{content:"▸ "}
details.minor[open]>summary::before{content:"▾ "}
details.minor .sendbar{margin-top:8px}
pre.code{direction:ltr;text-align:left;font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px;max-height:220px;overflow:auto;margin:0;white-space:pre}
.dmeta{display:flex;flex-wrap:wrap;gap:2px 10px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.dmeta span{direction:ltr;unicode-bidi:isolate}
</style>

<script>
/* DLJ parser — reads a Philips Dynalite System Builder job (.dlj = zip with Current/JobData.xml, UTF-16).
   Uses only basic DOM calls so it runs both in the browser (DOMParser) and in Node (xmldom). */
var DLJ = (function () {
  function kids(el, tag) {
    var out = [];
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && (!tag || n.nodeName === tag)) out.push(n);
    }
    return out;
  }
  function kid(el, tag) {
    for (var n = el.firstChild; n; n = n.nextSibling) {
      if (n.nodeType === 1 && n.nodeName === tag) return n;
    }
    return null;
  }
  function path(el) {
    var c = el;
    for (var i = 1; i < arguments.length && c; i++) c = kid(c, arguments[i]);
    return c;
  }
  function attr(el, n) {
    var v = el && el.getAttribute(n);
    return v == null ? '' : v;
  }

  function decodeXmlBytes(u8) {
    if (u8[0] === 0xff && u8[1] === 0xfe) return new TextDecoder('utf-16le').decode(u8.subarray(2));
    if (u8[0] === 0xfe && u8[1] === 0xff) return new TextDecoder('utf-16be').decode(u8.subarray(2));
    if (u8[0] === 0xef && u8[1] === 0xbb && u8[2] === 0xbf) return new TextDecoder('utf-8').decode(u8.subarray(3));
    if (u8[1] === 0) return new TextDecoder('utf-16le').decode(u8);
    return new TextDecoder('utf-8').decode(u8);
  }

  function deviceKind(props, flags, chCount) {
    if (props['MAC Address']) return 'gateway';
    if (flags.DALIBallastAttributes) return 'dali';
    if ('Panel Cover Type' in props) return 'panel';
    if (flags.CurrentSensorChannels) return 'relay';
    if (chCount) return 'load';
    return 'other';
  }

  function parseJob(doc, fileName) {
    var root = doc.documentElement;
    if (!root || root.nodeName !== 'DL4Job') throw new Error('הקובץ אינו פרויקט System Builder (חסר DL4Job).');

    // Physical channel count per device
    var chCount = {};
    var pc = path(root, 'NetworkData', 'Network', 'PhysicalChannelCache');
    if (pc) kids(pc, 'CachedPhysicalChannel').forEach(function (c) {
      var d = attr(c, 'duid').toUpperCase();
      chCount[d] = Math.max(chCount[d] || 0, +attr(c, 'channel') + 1);
    });

    // Devices
    var devices = {}, order = [];
    var dd = kid(root, 'DeviceData');
    (dd ? kids(dd, 'Device') : []).forEach(function (dev) {
      var duid = attr(dev, 'duid').toUpperCase();
      var dn = kid(dev, 'DyNetDevice');
      var props = {}, flags = {}, fw = '';
      var nmp = dn && kid(dn, 'NonMemoryProperties');
      (nmp ? kids(nmp, 'Property') : []).forEach(function (p) {
        kids(p).forEach(function (q) {
          var t = q.nodeName;
          if (t === 'FirmwareVersion') fw = attr(q, 'major') + '.' + attr(q, 'minor');
          else if (q.hasAttribute('name')) props[attr(q, 'name')] = attr(q, 'value');
          else flags[t] = true;
        });
      });
      var n = chCount[duid] || 0;
      // Pending-flash flag: a populated <DeviceStatus> (Modified/PendingUpdates) means System Builder
      // considers this controller to have unflashed changes. An empty <DeviceStatus/> = in-sync.
      var dstat = dn && kid(dn, 'DeviceStatus');
      var pending = !!(dstat && kids(dstat).length > 0);
      devices[duid] = {
        duid: duid,
        name: (props['Device Name'] || '').trim(),
        location: (props['Location'] || '').trim(),
        kind: deviceKind(props, flags, n),
        fw: fw,
        serial: props['Serial Number 64'] || '',
        mac: props['MAC Address'] || '',
        channels: n,
        pending: pending
      };
      order.push(duid);
    });

    // Logical network: folders → areas → channels
    var areas = {}, physMap = {};
    function readArea(el, folderPath) {
      var id = +attr(el, 'id');
      var a = { id: id, name: attr(el, 'name').trim(), path: folderPath, presets: {}, channels: [], devices: [] };
      kids(el).forEach(function (c) {
        if (c.nodeName === 'Channel') {
          var ch = { id: +attr(c, 'id'), name: attr(c, 'name').trim(), type: +attr(c, 'type'), desc: attr(c, 'description').trim(), phys: [] };
          kids(c, 'PhysicalChannel').forEach(function (p) {
            var d = attr(p, 'duid').toUpperCase(), num = +attr(p, 'channel');
            ch.phys.push([d, num]);
            physMap[d] = physMap[d] || {};
            physMap[d][num] = physMap[d][num] || [];
            physMap[d][num].push([id, ch.id]);
          });
          a.channels.push(ch);
        } else if (c.nodeName === 'Preset') {
          a.presets[attr(c, 'id')] = attr(c, 'name');
        } else if (c.nodeName === 'Device') {
          a.devices.push(attr(c, 'duid').toUpperCase());
        }
      });
      a.channels.sort(function (x, y) { return x.id - y.id; });
      return a;
    }
    function walk(f, folderPath) {
      var node = { type: 'folder', name: attr(f, 'id'), children: [] };
      kids(f).forEach(function (c) {
        if (c.nodeName === 'Folder') {
          var nm = attr(c, 'id');
          node.children.push(walk(c, folderPath.concat(nm)));
        } else if (c.nodeName === 'Area') {
          var a = readArea(c, folderPath);
          areas[a.id] = a;
          node.children.push({ type: 'area', id: a.id });
        }
      });
      return node;
    }
    var ln = path(root, 'LogicalData', 'LogicalNetwork');
    var rf = ln && kid(ln, 'Folder');
    var tree = rf ? walk(rf, []) : { type: 'folder', name: 'Root', children: [] };

    var name = (fileName || 'פרויקט').replace(/\.dlj$/i, '').replace(/^[0-9a-f]{8}-/i, '');

    // Connection settings stored in the job: the gateway's configured IP + DyNet port.
    // Lets the app auto-target the right PDEG when a project is opened.
    var conn = null;
    try {
      var tcps = doc.getElementsByTagName ? doc.getElementsByTagName('TCPConnection') : [];
      for (var ti = 0; ti < tcps.length; ti++) {
        var ip = (attr(tcps[ti], 'ip_address') || '').trim();
        if (ip) { conn = { ip: ip, port: (+attr(tcps[ti], 'port') || 95) }; break; }
      }
    } catch (e) {}

    return {
      name: name, fileName: fileName || '', version: attr(root, 'version'), builder: attr(root, 'EPversion'),
      loadedAt: Date.now(), tree: tree, areas: areas, devices: devices, deviceOrder: order, physMap: physMap,
      conn: conn
    };
  }

  // --- Output names live inside each controller's EEPROM image (target.hex), NOT in JobData.xml.
  // Verified on relay controllers (device code 0x60): a table of 18-byte records, 17 text bytes
  // (Windows-1255, space-padded) + a 0x00 terminator, starting at offset 0x1507.
  // The table is organised in blocks of 6 names: each block is a 7-byte header + 6 × 18-byte
  // records (17 text bytes + a 0x00 terminator). So consecutive names are 18 bytes apart, but
  // every 6th name jumps an extra 7 bytes for the next block header.
  var NAME_BASE = 0x1507, NAME_STRIDE = 18, NAME_LEN = 17, NAME_PER_BLOCK = 6, NAME_BLOCK = 115;
  function nameOffset(i) { return NAME_BASE + Math.floor(i / NAME_PER_BLOCK) * NAME_BLOCK + (i % NAME_PER_BLOCK) * NAME_STRIDE; }

  function hasNameTable(img) { return img && img.length >= NAME_BASE + NAME_STRIDE && img[NAME_BASE + NAME_LEN] === 0x00; }

    var s = '';
    for (var i = 0; i < bytes.length; i++) {
      var b = bytes[i];

    return s.replace(/\s+$/, '');
  }
  function win1255Encode(str) {
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);

      else if (c < 0x100) out.push(c);
      else out.push(0x3F); // '?' for anything we can't encode
    }
    return out;
  }
  function readOutputNames(img, count) {
    var names = [];
    for (var i = 0; i < count; i++) {
      var off = nameOffset(i);
      names.push(win1255Decode(img.subarray(off, off + NAME_LEN)));
    }
    return names;
  }
  // Dimmer (0x49) and DALI (0x65) controllers keep names in a variable-length packed blob
  // instead of the fixed table: "<KEY=VALUE>\0" segments ("D=<dev>", "PCn=<name>", "A<area>=…",
  // "SN=…") at a self-describing structure (header 80 ?? ?? 00 01 <baseHi> 20). PCn = output n.
  function findBlob(img) {
    for (var x = 0x1000; x < img.length - 8; x++) {

  async function parseDljBuffer(buf, fileName, JSZipLib, DOMParserCls) {
    var Z = JSZipLib || (typeof JSZip !== 'undefined' ? JSZip : null);

      var tf = tgtFiles[duid];

        var img = await tf.async('uint8array');
        if (hasNameTable(img)) {

          dv.outArea = readOutputAreas(img, dv.channels);
          dv.outChan = readOutputChans(img, dv.channels);
          dv.curtain = readCurtains(img, dv.channels);

  /* Apply structural moves and channel-name edits to a .dlj, return new zip bytes.

  async function applyEdits(buf, moves, names, JSZipLib) {
    var Z = JSZipLib || JSZip;

  }

  /* Back-compat: rename channels only. */
  async function applyChannelNames(buf, edits, JSZipLib) {

  /* Write per-output Area + Channel into each controller's EEPROM image (target.hex) — the

    var Z = JSZipLib || JSZip;

  /* Write per-output names into each controller's EEPROM image (target.hex).

  // Edit one PCn= name inside the packed blob (dimmer/DALI). Updates both length bytes and the
  // parallel flags array. Returns true if written. ff/flags are modified in place.
  function writeBlobName(img, source, flags, pcNum, name) {

      return s;

    for (var p = 0; p < enc.length; p++) img[B.textStart + p] = enc[p];
    img[B.blobLenOff] = img[B.blobLenOff] - delta;

/* Field confirmation ("תשובה"): after a command we read the real level/preset back from the

let confTimer=null, confOff=false, confBase='';
function confirmField(a, c){
  if(cfg.mode!=='pdeg') return;
  if(confBase!==cfg.base){ confBase=cfg.base; confOff=false; }   // new gateway → try again
  if(confOff) return;
  clearTimeout(confTimer);
  confTimer = setTimeout(async () => {
    try{
      if(c && c!==0){
        const t = await gwFetch(`/GetDyNet.cgi?a=${a}&c=${c}&_=${Date.now()}`, { quiet:true });
        const v = num(t); if(!isNaN(v)){ logPush('rx', `${areaLabel(a)} · ${chLabel(a, c)} · ${v}% ✓`, t); setLive(a, { level:[c,v] }); }
      } else {
        const t = await gwFetch(`/GetDyNet.cgi?a=${a}&_=${Date.now()}`, { quiet:true });
        const p = num(t); if(!isNaN(p)){ logPush('rx', `${areaLabel(a)} · פריסט נוכחי P${p} ✓`, t); setLive(a, { preset:p }); }
      }

  async setTemp(a, t){

  /* Set an area/channel over DyNet.
     DyNet2 → the byte-perfect op 0x10 path (works, left untouched).
     DyNet1 → "recall channel level" exactly as System Builder sends it, verified byte-for-byte against

/* ── CoolMaster (CoolMasterNet) direct control ──
   The app talks to the CoolMaster over its ASCII line protocol on a second TCP connection
   (native cmSend/cmPoll). The technician sets the CoolMaster address in the admin site
   (P.tech.cmIp / cmPort); unit→room mapping lives in P.tech.acUnits. */
const CM = {
  _ep: null,   // last working endpoint {host,port}
  local(){ const t=(P&&P.tech)||{}; return t.cmIp ? { host:t.cmIp, port:t.cmPort||10102 } : null; },
  ext(){ const t=(P&&P.tech)||{}; const h=t.cmExtIp||cfg.extBase; return h ? { host:h, port:t.cmExtPort||t.cmPort||10102 } : null; },
  // Candidate endpoints to try, in order: when on the external link, external first; else local first.
  candidates(){ const l=this.local(), e=this.ext(), out=[];
    if(cfg.activeConn==='ext'){ if(e)out.push(e); if(l)out.push(l); } else { if(l)out.push(l); if(e)out.push(e); }
    return out; },
  host(){ return this._ep ? this._ep.host : ((this.candidates()[0]||{}).host || ''); },
  port(){ return this._ep ? this._ep.port : ((this.candidates()[0]||{}).port || 10102); },
  enabled(){ return this.candidates().length>0 && HAS_TCP; },
  units(){ return (P && P.tech && P.tech.acUnits) || []; },        // [{line, addr, room, name}]
  uid(u){ let L=String(u.line||'L1').trim(); if(!/^L/i.test(L)) L='L'+L; return L+'.'+String(u.addr||'').trim(); },
  // Which room a unit belongs to: the explicitly chosen room id, else a name match.
  roomOf(u){ if(u.room!=null && u.room!=='') return String(u.room); const m=acMatchRoom(u.name); return m!=null?String(m):null; },
  unitsForRoom(aid){ return this.units().filter(u => this.roomOf(u)===String(aid))
                              .map(u => ({ uid:this.uid(u), name:u.name })); },
  async cmd(line){
    if(!HAS_TCP) throw new Error('זמין רק באפליקציה בטלפון (צריך חיבור TCP נייטיב).');
    const cand = this.candidates();
    if(!cand.length) throw new Error('CoolMaster לא מוגדר');
    const bytes = new TextEncoder().encode(line + '\r');
    let lastErr='';
    // Try the preferred endpoint first; if it can't connect, fall back to the other (local ↔ external).
    const order = this._ep ? [this._ep, ...cand.filter(e=>e.host!==this._ep.host||e.port!==this._ep.port)] : cand;
    for(const ep of order){
      const s = await native({ kind:'cmSend', host:ep.host, port:ep.port, b64:u8ToB64(bytes) });
      if(!s || s.error){ lastErr='אין חיבור ל-'+ep.host+':'+ep.port; this._ep=null; continue; }
      this._ep = ep;
      let text=''; const t0=Date.now();
      while(Date.now()-t0 < 3000){
        const r = await native({ kind:'cmPoll', wait:0.4 });
        if(r && r.b64){ text += new TextDecoder().decode(b64ToU8(r.b64)); if(/(^|\s)OK(\s|$)|Error/i.test(text)) break; }
        else if(text) break;
      }
      return text;
    }
    throw new Error(lastErr || 'אין חיבור ל-CoolMaster');
  },
  // Parse an `ls` listing. Columns: UID ON/OFF setpoint roomtemp fan mode [fail filter demand]
  parseLs(text){
    const num = s => { const x=parseFloat(String(s).replace(/[^\d.]/g,'')); return isNaN(x)?null:Math.round(x); };
    const out=[];
    (text||'').split(/\r?\n/).forEach(ln=>{
      const m = ln.trim().match(/^([A-Za-z]\d+\.\d+)\s+(ON|OFF)\s+(\S+)\s+(\S+)\s+(\S+)\s+(\S+)/i);
      if(!m) return;
      out.push({ uid:m[1], on:/on/i.test(m[2]), setTemp:num(m[3]), roomTemp:num(m[4]),
                 fan:(m[5]||'').toLowerCase(), mode:(m[6]||'').toLowerCase() });
    });
    return out;
  },
  async list(){ return this.parseLs(await this.cmd('ls')); },
  async setOn(uid, on){ return this.cmd((on?'on ':'off ')+uid); },
  async setMode(uid, mode){ return this.cmd(mode+' '+uid); },          // mode: 'cool' | 'heat'
  async setTemp(uid, t){ return this.cmd('temp '+uid+' '+t); },
  async setFan(uid, f){ return this.cmd('fspeed '+uid+' '+f); }        // f: l | m | h | a
};
let cmState = {};   // uid → last-known {on,setTemp,roomTemp,fan,mode}
let _cmPoll = null; // interval handle for live CoolMaster feedback while a room is open
// Match an A/C unit's name to a room by name (final-letter-insensitive, with the מאסטר→הורים alias).
function acMatchRoom(name){
  if(!name || !P) return null;
  const n = heNorm(name), ALIASES=[['מאסטר','הורים']];
  const rooms = Object.values(P.areas).map(a=>({id:a.id,nm:heNorm(areaName(a))})).filter(r=>r.nm);
  // 1) alias (מאסטר → הורים)
  for(const [aw,rw] of ALIASES){ if(n.includes(heNorm(aw))){ const c=rooms.filter(r=>r.nm.includes(heNorm(rw))).sort((a,b)=>b.nm.length-a.nm.length)[0]; if(c) return c.id; } }
  // 2) whole-name exact / substring either way
  let best=null; for(const r of rooms){ if(r.nm===n || r.nm.includes(n) || n.includes(r.nm)){ if(!best||r.nm.length>best.nm.length) best=r; } }
  if(best) return best.id;
  // 3) by significant word — handles abbreviations like "ח.אורחים" → "חדר אורחים"
  const STOP = new Set(['חדר','ח','חדרי','room']);
  const toks = n.split(/[^א-תa-z0-9]+/).filter(t => t.length>=2 && !STOP.has(t));
  for(const t of toks){ const c=rooms.filter(r=>r.nm.split(/[^א-תa-z0-9]+/).some(w=>w.length>=2 && (w===t || w.includes(t) || t.includes(w)))).sort((a,b)=>b.nm.length-a.nm.length)[0]; if(c) return c.id; }
  return null;
}

/* End-user auto-routing: on the home network use the local address; outside the home fall back to
   the external one. We decide by actually trying to open the local port — if it answers we're home,
   if it times out we're away — so it works without needing Wi-Fi/SSID permissions. */
async function autoResolveBase(){
  if(!(USER && cfg.conn==='auto' && HAS_TCP && cfg.mode==='pdeg')) return;
  const host = ip => (ip||'').trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'').split(':')[0];
  if(cfg.localBase){
    const o = await native({ kind:'tcpOpen', host:host(cfg.localBase), port:cfg.localPort||95 });
    if(o && !o.error){ cfg.base = cfg.localBase; cfg.tcpPort = cfg.localPort||95; cfg.activeConn='local'; return; }
    if(HAS_TCP) native({ kind:'tcpClose' });
  }
  if(cfg.extBase){ cfg.base = cfg.extBase; cfg.tcpPort = cfg.extPort||95; cfg.activeConn='ext'; return; }
  cfg.base = cfg.localBase || cfg.base; cfg.tcpPort = cfg.localPort||95; cfg.activeConn = cfg.localBase ? 'local' : '';
}
// Re-check which address (local/external) to use and switch immediately if it changed.
let _netTimer = null;
async function netCheck(announce){
  if(!(USER && HAS_TCP && cfg.mode==='pdeg')){ if(announce) toast('בדיקת רשת זמינה באפליקציה בטלפון'); return; }
  const prev = (cfg.base||'')+'|'+(cfg.activeConn||'');
  await autoResolveBase();
  if(((cfg.base||'')+'|'+(cfg.activeConn||'')) !== prev){
    if(HAS_TCP) await native({ kind:'tcpClose' });
    if(typeof CM!=='undefined') CM._ep=null;      // re-resolve the CoolMaster endpoint too
    connect();
    if(announce) toast('החיבור עבר ל'+(cfg.activeConn==='ext'?'כתובת חיצונית':'כתובת מקומית'),3500);
  } else if(announce){ toast('החיבור יציב · '+(cfg.activeConn==='ext'?'חיצוני':'מקומי'),2500); }
}
function startNetCheck(){ if(_netTimer) return; _netTimer=setInterval(()=>netCheck(false), 120000); }   // every 2 min in the background
async function connect(){
  setLink('wait','מתחבר…');
  link.info = null;
  await autoResolveBase();   // pick local vs external before opening the real link
  // Native app, live mode: the real link is the TCP DyNet port (the same channel
  // System Builder uses). The HTTP web API is optional and must NOT gate the link —
  // so the app connects to ANY IP the user types, as long as port 95 is reachable.
  if(HAS_TCP && cfg.mode==='pdeg'){
    const o = await native({ kind:'tcpOpen', host:tcpHost(), port:cfg.tcpPort });
    if(o && !o.error){
      const was = link.state;
      setLink('on','מחובר');
      if(was!=='on') logPush('rx', `מחובר ל-PDEG · TCP ${tcpHost()}:${cfg.tcpPort}`);   // log only on a real (re)connect
      // No automatic HTTP: the native app rides purely on TCP. Device status is fetched only when
      // the user taps "בדוק עכשיו"; FW/bus info loads when the Settings tab opens (HTTP mode only).
      if(route.area!=null) requestArea(P.areas[route.area], true);   // silently refresh the open room on (re)connect
      tcpListen();
    } else {
      setLink('err','אין קשר'); logPush('err', 'אין חיבור TCP ל-PDEG: '+((o&&o.error)||''), tcpHost()+':'+cfg.tcpPort);
    }
    if(route.tab==='setup' && !dbxAwaitingCode) renderSetup($('#main'));
    return;
  }
  // Simulation, or a browser served from the PDEG / a-Shell: probe via the HTTP web API.
  try{
    const id = await GW.ident();
    const bus = await GW.bus().catch(()=>null);
    link.info = { id, bus };

async function tcpListen(){

    const o = await native({ kind:'tcpOpen', host:tcpHost(), port:cfg.tcpPort });
    if(!o || o.error){ setTcp('err'); logPush('err', 'אין חיבור TCP ל-PDEG: '+((o&&o.error)||''), tcpHost()+':'+cfg.tcpPort); await sleep(5000); continue; }

/* Read the whole room's state back from the PDEG — SILENTLY (updates the sliders/ring to the

async function requestArea(a, quiet){

  try{

    const p = num(pt); if(!isNaN(p)) setLive(a.id, { preset:p });
    for(const ch of a.channels){

function assignLogicalInMemory(duid, pc, area, chan, name){
  const DU = String(duid).toUpperCase();

  if(!P.areas[area]) P.areas[area] = { id:area, name:'', path:[], presets:{}, channels:[], devices:[] };

  const A = P.areas[area];
  let ch = A.channels.find(c=>c.id===chan);
  if(!ch){ ch = { id:chan, name:name||'', type:1, desc:'', phys:[] }; A.channels.push(ch); A.channels.sort((x,y)=>x.id-y.id); }
  if(name) ch.name = name;
  ch.phys = ch.phys || []; if(!ch.phys.some(same)) ch.phys.push([DU, pc]);
  if(!A.devices.includes(DU)) A.devices.push(DU);

/* Assign to an existing channel: update model + record move. */
function assignOutput(duid, pc, toA, toC){
  const target = findCh(toA, toC); if(!target){ toast('הערוץ שנבחר לא קיים.'); return; }
  detachOutput(duid, pc);
  if(!target.phys.some(p => p[0]===duid && p[1]===pc)) target.phys.push([duid, pc]);
  P.physMap[duid] = P.physMap[duid] || {};
  P.physMap[duid][pc] = [[toA, toC]];
  P.reassign[duid+':'+pc] = { toArea:toA, toCh:toC };
  persist();
  toast(`היציאה שויכה ל“${areaName(P.areas[toA])} › ${chName(target)}”. שמור לקובץ כדי שיישמר.`, 5000);
}
/* Create a NEW channel in the area and assign the output to it (unique per controller). */
function assignOutputNew(duid, pc, toA, name){
  const area = P.areas[toA]; if(!area){ toast('האזור לא קיים.'); return; }
  const newId = (area.channels||[]).reduce((m,c)=>Math.max(m,c.id), 0) + 1;
  detachOutput(duid, pc);
  const ch = { id:newId, name:name, type:1, desc:'', phys:[[duid, pc]] };
  area.channels.push(ch);
  P.physMap[duid] = P.physMap[duid] || {};
  P.physMap[duid][pc] = [[toA, newId]];
  P.reassign[duid+':'+pc] = { toArea:toA, newName:name };
  persist();
  toast(`נוצר ערוץ חדש “${esc(name)}” באזור ${areaName(area)} ושויך ליציאה. שמור לקובץ.`, 5000);
}
/* Remove an output from whatever logical channels it currently sits in. */
function detachOutput(duid, pc){
  const prev = (P.physMap[duid] && P.physMap[duid][pc]) ? P.physMap[duid][pc].slice() : [];
  prev.forEach(([aid,cid]) => { const ch=findCh(aid,cid); if(ch) ch.phys = ch.phys.filter(p => !(p[0]===duid && p[1]===pc)); });
}
/* Build the full desired channel-name map from what the app currently shows,
   so a save writes the real names even if P.edits was lost across a reload. */
function buildChannelNameMap(){
  const map = {};
  if(P && P.areas) for(const aid in P.areas){ const a = P.areas[aid]; (a.channels||[]).forEach(ch => { map[a.id+':'+ch.id] = ch.name || ''; }); }
  return map;
}
/* Pending output→area moves, as applyEdits expects them. */
function buildMoves(){
  const moves = [];
  const r = (P && P.reassign) || {};
  for(const key in r){ const i = key.lastIndexOf(':'); const duid = key.slice(0,i), pc = +key.slice(i+1); const mv = { duid, pc, toArea:r[key].toArea };
    if(r[key].newName!=null) mv.newName = r[key].newName; else mv.toCh = r[key].toCh;
    moves.push(mv); }
  return moves;
}
/* Apply everything the user changed to a .dlj buffer: controller output names (in the
   device memory image — what System Builder shows), plus any logical channel renames/moves. */
/* Build logical moves from the per-output area/channel edits, so the assignment is also
   written into JobData.xml (the logical channel) with the output's name. */
function buildACMovesWithNames(){
  const moves = [];
  const ac = (P && P.devAC) || {};
  for(const duid in ac){ const dv = P.devices[duid]; for(const k in ac[duid]){
    const pc = +k, e = ac[duid][k];
    if(!e.logical) continue; // only outputs the user chose to also write logically
    const name = (dv && dv.outNames && dv.outNames[pc]) || '';
    moves.push({ duid, pc, toArea: e.area, toCh: e.chan, name });
  } }
  return moves;
}
async function applyProjectEdits(base){
  let bytes = base, total = 0;
  const outNames = buildOutputNames(), areaChan = buildAreaChan();
  const on = await DLJ.applyOutputNames(bytes, outNames);
  bytes = on.bytes; total += on.changed;
  const ac = await DLJ.applyOutputAreaChan(bytes, areaChan);
  bytes = ac.bytes; total += ac.changed;
  const moves = buildMoves().concat(buildACMovesWithNames()); // the latter self-filters by the per-output choice
  const le = await DLJ.applyEdits(bytes, moves, buildChannelNameMap());
  bytes = le.bytes; total += le.changed;
  // mark every controller we edited (name/area/channel in its image) as "pending download"
  // in JobData.xml — this is what lights System Builder's download indicator.
  const touched = Array.from(new Set(Object.keys(outNames).concat(Object.keys(areaChan))));
  const ds = await DLJ.applyDeviceStatus(bytes, touched);
  bytes = ds.bytes; total += ds.changed;
  return { bytes, changed: total };
}

/* ───────── Flash a controller ("Save To Device") over the PDEG ─────────
   Writes only the bytes the file marks dirty (flag 0x07), exactly like System Builder:
   Silence → write each <=15-byte chunk and wait for the controller's ack → Reset. */
let flashRx = new Uint8Array(0);
function u8concat(a, b){ const n = new Uint8Array(a.length + b.length); n.set(a); n.set(b, a.length); return n; }
async function flashSendAck(frame, addr, timeoutMs){
  await native({ kind:'tcpSend', host:tcpHost(), port:cfg.tcpPort, b64:u8ToB64(frame) });
  const end = Date.now() + timeoutMs;
  while(Date.now() < end){
    const r = await native({ kind:'tcpPoll', wait:1 });
    if(r && r.error) throw new Error('שגיאת תקשורת מול ה-PDEG');
    if(r && r.b64){
      flashRx = u8concat(flashRx, b64ToU8(r.b64));
      let frames; [flashRx, frames] = DyNet2.pull(flashRx);
      for(const f of frames){
        if(f[2] === 0x9D){ const a = (f[10]<<16)|(f[11]<<8)|f[12]; if(a === addr) return f; }  // write-reply for this address
      }
    }
  }
  return null;
}
async function flashRun(dstDev, dstBox, chunks, channels, onProg, cancel){
  flashRx = new Uint8Array(0);
  await native({ kind:'tcpSend', host:tcpHost(), port:cfg.tcpPort, b64:u8ToB64(DyNet2.silence(dstDev, dstBox)) });
  await sleep(150);
  for(let k=0;k<chunks.length;k++){
    if(cancel.v) throw new Error('בוטל על ידך');
    const c = chunks[k], fr = DyNet2.writeMem(dstDev, dstBox, c.addr, c.data);
    let ack = null;
    for(let t=0; t<3 && !ack; t++) ack = await flashSendAck(fr, c.addr, 2500);
    if(!ack) throw new Error(`אין אישור מהבקר בכתובת 0x${c.addr.toString(16)} (קטע ${k+1}/${chunks.length})`);
    onProg(k+1, chunks.length);
  }
  // Like System Builder: set every physical output to 0% so the controller applies the new config cleanly.
  for(let ch=1; ch<=(channels||0); ch++){
    await native({ kind:'tcpSend', host:tcpHost(), port:cfg.tcpPort, b64:u8ToB64(DyNet.physLevel(dstDev, dstBox, ch, 0)) });
    await sleep(60);
  }
  await native({ kind:'tcpSend', host:tcpHost(), port:cfg.tcpPort, b64:u8ToB64(DyNet2.reset(dstDev, dstBox)) });  // reboot the controller
  await sleep(400);
}
function progressModal(title){
  const ov = document.createElement('div'); ov.className = 'modal-ov';
  const cancel = { v:false };
  ov.innerHTML = `<div class="modal"><div class="modal-msg">${esc(title)}</div>
    <div id="pmTxt" style="font-size:13px;color:var(--muted);margin:6px 0">מתחיל…</div>
    <div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0"><div id="pmBar" style="height:100%;width:0;background:var(--accent);transition:width .2s"></div></div>
    <div class="modal-btns"><button class="btn ghost" id="pmCancel">ביטול</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#pmCancel').onclick = () => { cancel.v = true; ov.querySelector('#pmTxt').textContent = 'מבטל…'; };
  return {
    cancel,
    set(done,total){ const p = Math.round(done/total*100); ov.querySelector('#pmBar').style.width = p+'%'; ov.querySelector('#pmTxt').textContent = `כותב קטע ${done} מתוך ${total} (${p}%)`; },
    msg(t){ ov.querySelector('#pmTxt').textContent = t; },
    close(){ ov.remove(); }
  };
}
async function flashDevice(duid, mode){
  if(USER) return;   // end-user build never writes to controllers
  mode = mode==='full' ? 'full' : 'inc';
  const dv = P && P.devices[duid]; if(!dv) return;
  if(!HAS_TCP || cfg.mode!=='pdeg'){ toast('עדכון בקר דורש חיבור ישיר ל-PDEG (אפליקציית אייפון, מצב PDEG).', 6000); return; }
  let base = origDlj; if(!base){ base = await idb.get('dlj'); origDlj = base; }
  if(!base){ toast('צריך את קובץ הפרויקט. פתח אותו שוב מ-Dropbox.', 6000); return; }
  let info, edited;
  // 'inc' = only the bytes that changed (like SB's incremental Save To Device).
  // 'full' = every managed byte (a full config download + reboot).
  try{ edited = await applyProjectEdits(base); info = mode==='full' ? await DLJ.deviceFullChunks(edited.bytes, duid) : await DLJ.deviceFlashChunks(edited.bytes, duid); }
  catch(e){ toast('שגיאה בהכנת הנתונים: '+e.message, 6000); return; }
  if(!info || !info.chunks.length){
    if(mode==='inc') toast(devPending(dv) ? 'אין בתים בודדים שהשתנו — השתמש ב„הורדה מלאה” כדי לשפוך את כל התצורה.' : 'אין שינויים לעדכן בבקר "'+(dv.name||KIND[dv.kind])+'".', 6000);
    else if(devPending(dv)){ try{ const cleaned = await DLJ.clearDeviceDirty(edited.bytes, duid); origDlj = cleaned.bytes.buffer; idb.put('dlj', origDlj); dv.pending=false; P.unsaved=true; persist(); if(route.tab==='devices') renderDevices($('#main')); toast('אין תוכן לכתיבה בבקר — סומן כמעודכן.', 6000); }catch(e){ toast('שגיאה: '+e.message, 6000); } }
    else toast('אין תוכן לכתיבה בבקר "'+(dv.name||KIND[dv.kind])+'".', 5000);
    return;
  }
  const isFull = mode==='full';
  const ok = await confirmModal(
    (isFull
      ? `הורדה מלאה לבקר "${dv.name||KIND[dv.kind]}" (Box ${info.box})?\n\nכל התצורה המנוהלת (${info.dirty} בייטים ב-${info.chunks.length} קטעים) תיכתב לזיכרון הבקר, והבקר יאותחל.`
      : `לעדכן את הבקר "${dv.name||KIND[dv.kind]}" (Box ${info.box})?\n\n${info.dirty} בייטים ב-${info.chunks.length} קטעים ייכתבו לזיכרון הבקר, והבקר יאותחל.`)
    + `\n\n⚠️ ודא שבדקת את השינויים ב-System Builder. הפעולה משנה את החומרה.`,
    isFull ? 'כן, הורד תצורה מלאה' : 'כן, עדכן בקר', 'ביטול');
  if(!ok) return;
  const prog = progressModal(`מעדכן את "${dv.name||KIND[dv.kind]}" (Box ${info.box})`);
  tcp.running = false;                                   // pause live listening — take over the link
  try{
    await native({ kind:'tcpClose' }); await sleep(350);
    const o = await native({ kind:'tcpOpen', host:tcpHost(), port:cfg.tcpPort });
    if(!o || o.error) throw new Error('אין חיבור ל-PDEG: '+((o&&o.error)||''));
    await flashRun(info.dcode, info.box, info.chunks, dv.channels||0, (d,t)=>prog.set(d,t), prog.cancel);
    logPush('tx', `עדכון בקר: ${dv.name||''} (Box ${info.box}) — ${info.dirty} בייטים, ${info.chunks.length} קטעים`, '');
    // Post-flash: clear the dirty markers in memory so the device shows as synced — but DON'T
    // upload to Dropbox. The file is saved only when the user explicitly presses "עדכן ב-Dropbox".
    prog.msg('✅ נכתב לבקר. מסיים…');
    try{
      const cleaned = await DLJ.clearDeviceDirty(edited.bytes, duid);
      origDlj = cleaned.bytes.buffer; idb.put('dlj', origDlj);   // in-memory only — not uploaded
      if(P.devNames) delete P.devNames[duid];
      if(P.devAC) delete P.devAC[duid];
      if(P.reassign) for(const key in P.reassign){ if(key.slice(0, key.lastIndexOf(':'))===duid) delete P.reassign[key]; }
      if(dv) dv.pending = false;          // the controller is now in sync → its "ממתין לשפיכה" sign clears
      P.unsaved = true;                    // the file changed (dirty cleared) — keep "עדכן ב-Dropbox" available
      persist();
      prog.msg('✅ העדכון הושלם. הבקר אותחל.');
    }catch(e){
      logPush('err', 'ניקוי הסימון אחרי שפיכה נכשל: '+e.message, '');
      prog.msg('✅ נכתב לבקר, אך ניקוי הסימון נכשל: '+e.message);
    }
    toast('הבקר עודכן ✅ — לחץ „עדכן ב-Dropbox” כשתסיים כדי לשמור את הקובץ.', 6500);
    await sleep(1600);
  }catch(e){
    prog.msg('❌ '+e.message);
    logPush('err', 'עדכון בקר נכשל: '+e.message, '');
    toast('העדכון נכשל: '+e.message, 7000);
    await sleep(2600);
  }finally{
    prog.close();
    await native({ kind:'tcpClose' }); await sleep(200);
    tcp.running = false; tcpListen();                    // resume live listening
    if(route.tab==='devices') renderDevices($('#main'));  // reflect the cleared "pending" markers
  }
}
async function saveProject(){
  if(USER) return;   // end-user build never saves the project
  try{
    toast('מעדכן את קובץ הפרויקט…');
    if(P.source && P.source.dropbox){
      const { uploaded } = await dbxSaveProject(P.source.dropbox);
      if(!uploaded){ toast('אין שינויים לעדכון בקובץ.', 7000); return; }
      toast('נשמר ב-Dropbox ✅', 6000);
      P.edits = {}; P.reassign = {}; P.devNames = {}; P.devAC = {}; P.unsaved = false; persist(); render();
    } else {
      if(!origDlj) origDlj = await idb.get('dlj');
      if(!origDlj){ toast('כדי לשמור צריך את קובץ ה-DLJ המקורי. פתח אותו שוב מ-Dropbox או מהטלפון — השינויים יישמרו.', 6000); return; }
      const res = await applyProjectEdits(origDlj);
      if(res.changed === 0 && !P.unsaved){ toast('לא נמצאו שינויים לעדכון בקובץ.', 7000); return; }
      const bytes = res.changed>0 ? res.bytes : new Uint8Array(origDlj);
      if(NATIVE){ await native({ kind:'saveFile', name:P.fileName||'project.dlj', b64:u8ToB64(bytes) }); }
      else { const blob = new Blob([bytes], { type:'application/octet-stream' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = P.fileName || 'project.dlj'; document.body.appendChild(a); a.click(); a.remove(); }
      toast('הקובץ המעודכן ירד למכשיר ✅', 6000);
      origDlj = (res.changed>0 ? res.bytes.buffer : origDlj); idb.put('dlj', origDlj);
      P.edits = {}; P.reassign = {}; P.devNames = {}; P.devAC = {}; P.unsaved = false; persist(); render();
    }
  }catch(e){ toast('השמירה נכשלה: '+e.message, 6000); }
}

function statusOf(dv){ const k=devKey(dv); return k ? (devStatus[k]||'unknown') : 'unknown'; }
// A controller "needs flash" if the file marks it pending (DeviceStatus) or it has unsaved in-app edits.
function devHasEdits(duid){ return !!((P.devNames&&P.devNames[duid]&&Object.keys(P.devNames[duid]).length) || (P.devAC&&P.devAC[duid]&&Object.keys(P.devAC[duid]).length) || Object.keys(P.reassign||{}).some(k=>k.slice(0,k.lastIndexOf(':'))===duid)); }
function devPending(dv){ return !!(dv && (dv.pending || devHasEdits(dv.duid))); }
function devMatches(dv, q){
  if(!q) return true;
  if((dv.name||'').toLowerCase().includes(q)) return true;
  if((dv.location||'').toLowerCase().includes(q)) return true;
  if(dv.box!=null && ('box '+dv.box).includes(q)) return true;
  if(dv.box!=null && String(dv.box)===q) return true;
  if(dv.dcode!=null && ('0x'+hex2(dv.dcode)).toLowerCase().includes(q)) return true;
  if(dv.serial && dv.serial.includes(q)) return true;
  const map = P.physMap[dv.duid] || {};
  for(const n in map) for(const [aid,cid] of map[n]){ const ch=findCh(aid,cid); if(ch && (ch.name||'').toLowerCase().includes(q)) return true; if(areaName(P.areas[aid]).toLowerCase().includes(q)) return true; }
  return false;
}

function logExportText(){

function renderLog(m){
  m.innerHTML = `<div class="actions"><button class="btn" id="logExport">שתף לוג</button><button class="btn ghost" id="logClear">נקה</button><span class="muted" style="font-size:12.5px;align-self:center">${logLines.length} רשומות</span></div>
    <div class="log" id="log">${logLines.length ? logLines.slice().reverse().map(logHtml).join('') : '<div class="empty">אין עדיין פעילות. ביומן תופיע כל תעבורת ה-DyNet מהרשת — מפסקים, סצנות, שינויי עומק, ופעולות של System Builder — בזמן אמת (דורש חיבור ל-PDEG).</div>'}</div>`;
  $('#logClear').addEventListener('click', () => { logLines.length=0; renderLog(m); });
  $('#logExport').addEventListener('click', () => {
    const txt = logExportText();
    if(!txt){ toast('היומן ריק'); return; }
    const done = () => toast('הלוג הועתק — הדבק לי אותו כאן', 4000);
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done, () => showLogText(txt)); }
    else showLogText(txt);
  });
}
function showLogText(txt){
  const ov = document.createElement('div'); ov.className='modal-ov';
  ov.innerHTML = `<div class="modal"><div class="modal-msg">בחר הכול והעתק את היומן, ואז הדבק לי אותו:</div>
    <textarea readonly style="width:100%;height:200px;direction:ltr;font-family:var(--mono);font-size:11px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px"></textarea>
    <div class="modal-btns"><button class="btn primary" data-copy>העתק</button><button class="btn ghost" data-close>סגור</button></div></div>`;
  const ta = ov.querySelector('textarea'); ta.value = txt;
  ov.querySelector('[data-copy]').onclick = () => { ta.focus(); ta.select(); try{ document.execCommand('copy'); toast('הועתק'); }catch(e){ toast('סמן ידנית והעתק'); } };
  ov.querySelector('[data-close]').onclick = () => ov.remove();
  ov.addEventListener('click', e => { if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
}

/* ───────── Dropbox: sign in on Dropbox's page, paste the code back ─────────
   The app runs on the PDEG over plain HTTP, which Dropbox won't accept as a redirect,
   so it uses Dropbox's "show me a code" flow (PKCE, no redirect). */
function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
let dbxVerifierMem = '';
// GitHub Pages redirect page. After the user authorises, Dropbox redirects here with ?code=…,
// and the page hands the code back to the app via the dynetremote:// deep link (see dbx.html).
const DBX_REDIRECT = 'https://arazishaked.github.io/dynet-auth/';
// Use the redirect flow only in the native app, where the dynetremote:// deep link can bring the
// code back automatically. Elsewhere (Scriptable / web on the PDEG) fall back to the paste-the-code flow.
const DBX_USE_REDIRECT = NATIVE;
async function dbxAuthUrl(){
  ensureDbxKey();
  const v = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  // Persist the verifier and WAIT for it, so it survives a WebView reload while the user is in Safari.
  // Otherwise the exchange could run with a stale verifier and Dropbox reports "code doesn't exist or has expired".
  dbxVerifierMem = v;
  if(NATIVE){ KV['dbxVerifier'] = JSON.stringify(v); await native({ kind:'kvset', key:'dbxVerifier', value:KV['dbxVerifier'] }); }
  else store.set('dbxVerifier', v);
  const p = { client_id:cfg.dbxKey, response_type:'code', code_challenge:ch, code_challenge_method:'S256', token_access_type:'offline' };
  if(DBX_USE_REDIRECT) p.redirect_uri = DBX_REDIRECT;   // must exactly match a URI registered in the Dropbox App Console
  const u = new URL('https://www.dropbox.com/oauth2/authorize');
  u.search = new URLSearchParams(p);
  return u.toString();
}
async function dbxExchange(code){
  const p = { code:code.trim(), grant_type:'authorization_code', client_id:cfg.dbxKey, code_verifier: dbxVerifierMem || store.get('dbxVerifier','') };
  if(DBX_USE_REDIRECT) p.redirect_uri = DBX_REDIRECT;   // must match the redirect_uri used in the authorize request
  const r = await xfetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body:new URLSearchParams(p) });
  const j = await r.json(); if(!r.ok) throw new Error(j.error_description || 'הקוד לא התקבל. נסה שוב.');
  store.set('dbx', { access:j.access_token, refresh:j.refresh_token, exp:Date.now()+j.expires_in*1000 }); store.del('dbxVerifier');
}
// Called by the native host (App.swift .onOpenURL) when the dynetremote://auth?code=… deep link fires,
// so the Dropbox connection completes automatically with no copy-paste.
window.__dbxDeepCode = async function(code){
  if(!code) return;
  try{
    await dbxExchange(code);
    dbxAwaitingCode = false;
    toast('מחובר ל-Dropbox');
    if($('#dbxPane') && !$('#dbxPane').hidden) dbxBrowse('');
    else if(typeof renderSetup==='function' && $('#main')) renderSetup($('#main'));
  }catch(e){ logPush('err', 'Dropbox: '+e.message); toast('חיבור Dropbox נכשל: '+e.message, 6000); }
};
async function dbxToken(){
  ensureDbxKey();
  const t = store.get('dbx', null); if(!t) return null;
  if(t.manual) return t.access;                // token pasted from the console; no refresh
  if(Date.now() < t.exp - 60000) return t.access;
  if(!t.refresh){ return null; }               // nothing to refresh with, but keep whatever we have
  let r, j;
  try{
    r = await xfetch('https://api.dropboxapi.com/oauth2/token', { method:'POST', body:new URLSearchParams({ grant_type:'refresh_token', refresh_token:t.refresh, client_id:cfg.dbxKey }) });
    j = await r.json();
  }catch(e){ return null; }                     // transient/network error — DON'T wipe the login, just retry next time
  if(!r.ok){
    // Only forget the connection if Dropbox says the refresh token itself is dead.
    if(j && (j.error==='invalid_grant' || j.error==='invalid_client')){ store.del('dbx'); }
    return null;
  }
  t.access=j.access_token; t.exp=Date.now()+j.expires_in*1000;
  if(j.refresh_token) t.refresh=j.refresh_token; // Dropbox may rotate it
  store.set('dbx', t); return t.access;
}
async function dbxApi(ep, args){
  const tok = await dbxToken(); if(!tok) throw new Error('יש להתחבר ל-Dropbox מחדש');
  const r = await xfetch('https://api.dropboxapi.com/2/'+ep, { method:'POST', headers:{ Authorization:'Bearer '+tok, 'Content-Type':'application/json' }, body:JSON.stringify(args) });
  if(!r.ok) throw new Error('Dropbox '+r.status+': '+(await r.text()).slice(0,120)); return r.json();
}
const dbxArg = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => '\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
// Sort key for a Dropbox file: the date written in its name (DD-MM-YY / DD-MM-YYYY, any of - . / _ or
// space as separator), as a timestamp. Falls back to the file's modified time when the name has no date.
function fileDateKey(e){
  const m = (e.name||'').match(/(\d{1,2})[.\-_\/ ](\d{1,2})[.\-_\/ ](\d{2,4})(?!\d)/);
  if(m){
    let d=+m[1], mo=+m[2], y=+m[3];
    if(mo>12 && d<=12){ const t=d; d=mo; mo=t; }   // tolerate MM-DD-YY just in case
    if(y<100) y+=2000;
    if(d>=1 && d<=31 && mo>=1 && mo<=12) return Date.UTC(y, mo-1, d);
  }
  return e.server_modified ? Date.parse(e.server_modified) : 0;
}

      <div class="sendbar"><input id="dbxCode" placeholder="קוד (רק אם לא חזר אוטומטית)" autocomplete="off"><button class="btn primary" id="dbxCodeOk">אישור</button></div>`;
